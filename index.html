            過去 ${deal.sessionsCount} 回の商談履歴あり${pending ? ' · <strong>前回未完了アクション ' + pending + ' 件</strong>' : ''}
          </div>` : `
          <div class="deal-preview-history">
            ${svgIcon('i-sparkle', 12)}
            初回商談です
          </div>`}
      `;
      updateNewSessionStartButton();
    }

    function updateNewSessionStartButton() {
      const ready = pendingNewSession.dealId && pendingNewSession.slides && pendingNewSession.audio;
      document.getElementById('newSessionStart').disabled = !ready;
    }

    function updateModalFilePicker(kind, meta) {
      const id = kind === 'slides' ? 'modalSlidePicker' : 'modalAudioPicker';
      const el = document.getElementById(id);
      const nameEl = el.querySelector('.file-picker-name');
      if (meta) {
        el.classList.add('picked');
        nameEl.classList.remove('empty');
        const sizeStr = meta.sizeBytes ? ' · ' + formatBytes(meta.sizeBytes) : '';
        nameEl.textContent = meta.name + sizeStr;
        el.querySelector('.file-picker-action').textContent = '変更';
      } else {
        el.classList.remove('picked');
        nameEl.classList.add('empty');
        nameEl.textContent = '未選択';
        el.querySelector('.file-picker-action').textContent = '選択';
      }
    }

    async function handleModalFilePick(kind) {
      try {
        const picked = kind === 'slides'
          ? await pickSlideFromAnywhere()
          : await pickAudioFromAnywhere();
        if (!picked) return;
        pendingNewSession[kind] = picked;
        updateModalFilePicker(kind, picked.meta);
        updateNewSessionStartButton();
      } catch (e) {
        alert('ファイル選択エラー: ' + (e && e.message ? e.message : e));
      }
    }

    function resetNewSessionModal() {
      pendingNewSession.dealId = null;
      pendingNewSession.goal = '';
      pendingNewSession.slides = null;
      pendingNewSession.audio = null;
      document.getElementById('dealSelector').value = '';
      document.getElementById('dealPreview').style.display = 'none';
      document.getElementById('sessionGoal').value = '';
      updateModalFilePicker('slides', null);
      updateModalFilePicker('audio', null);
      updateNewSessionStartButton();
    }

    function openNewSessionModal() {
      resetNewSessionModal();
      document.getElementById('newSessionModal').classList.add('open');
    }
    function closeNewSessionModal() {
      document.getElementById('newSessionModal').classList.remove('open');
    }

    async function startNewSession() {
      const deal = dealService.get(pendingNewSession.dealId);
      if (!deal || !pendingNewSession.slides || !pendingNewSession.audio) return;

      const goal = document.getElementById('sessionGoal').value.trim();
      const today = new Date();
      const datePad = n => String(n).padStart(2, '0');
      const sessionId = 'session-' + Date.now();

      // Update active session metadata
      MOCK_DATA.meta.title = deal.customer + '様 ' + deal.productLine + ' 提案商談';
      MOCK_DATA.meta.customerCompany = deal.customer + '（' + deal.industry + ' / ' + deal.size + '）';
      MOCK_DATA.meta.meetingDate = today.getFullYear() + '-' + datePad(today.getMonth() + 1) + '-' + datePad(today.getDate());
      MOCK_DATA.meta.goal = goal;
      MOCK_DATA.meta.files.slides = pendingNewSession.slides.meta.name;
      MOCK_DATA.meta.files.audio = pendingNewSession.audio.meta.name;

      pickedFiles.slides = pendingNewSession.slides.meta;
      pickedFiles.audio = pendingNewSession.audio.meta;

      closeNewSessionModal();

      // [Pipeline sync] Session was created — Pipeline can log it as an Activity.
      pipelineSync.sessionStarted({
        sessionId,
        dealId: deal.id,
        startedAt: new Date().toISOString(),
        goal,
        slides: pendingNewSession.slides.meta,
        audio: pendingNewSession.audio.meta
      });

      // Apply files to the workspace
      try {
        await applySlideToWorkspace(pendingNewSession.slides);
      } catch (e) {
        alert('スライド適用エラー: ' + (e && e.message ? e.message : e));
        return;
      }
      applyAudioToWorkspace(pendingNewSession.audio);

      renderHeader();

      // Run the staged progress
      await runAnalysisProgress();

      // [Pipeline sync] Analysis finished — Pipeline can update qualification
      // and pick up newly generated action items.
      pipelineSync.sessionAnalyzed({
        sessionId,
        dealId: deal.id,
        slideCount: MOCK_DATA.slides.length,
        avgMappingConfidence: avgConfidence()
      });
      pipelineSync.actionsGenerated(MOCK_DATA.overall.nextActions || []);
      pipelineSync.frameworkUpdated({
        sessionId, dealId: deal.id, bant: MOCK_DATA.overall.bant
      });

      // Land on the feedback tab so the user sees the deliverable
      switchTab('feedback');
    }

    function avgConfidence() {
      const vals = MOCK_DATA.slides.map(s => s.mappingConfidence).filter(v => v != null);
      if (!vals.length) return null;
      return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 100) / 100;
    }

    async function handleAnalyzeClick() {
      // Always run the staged progress — it's the centerpiece of the demo.
      await runAnalysisProgress();

      // If we're in real GAS context with both files picked, also hit the server.
      if (drive.inGas() && pickedFiles.slides && pickedFiles.audio &&
          !String(pickedFiles.slides.id).startsWith('local-') &&
          !String(pickedFiles.audio.id).startsWith('sample-')) {
        try {
          await drive.callServer('processSession', {
            slideFileId: pickedFiles.slides.id,
            audioFileId: pickedFiles.audio.id
          });
        } catch (e) { console.warn('processSession failed:', e); }
      }

      // Refresh transcript/feedback so any preserved AI output shows for the active slide.
      renderTranscript();
      renderFeedback();
      switchTab('feedback');
    }

    /* ============================================================
       Render
       ============================================================ */
    function renderHeader() {
      document.getElementById('meetingTitle').textContent = MOCK_DATA.meta.title;
      document.getElementById('meetingDate').textContent = MOCK_DATA.meta.meetingDate;
      document.getElementById('meetingCustomer').textContent = MOCK_DATA.meta.customerCompany;
      document.getElementById('analyzedAt').textContent = MOCK_DATA.meta.analyzedAt;
      document.getElementById('duration').textContent = MOCK_DATA.meta.duration;
      document.querySelector('#slideUpload .upload-filename').textContent = MOCK_DATA.meta.files.slides;
      document.querySelector('#audioUpload .upload-filename').textContent = MOCK_DATA.meta.files.audio;
      const goalEl = document.getElementById('headerGoal');
      const goalText = document.getElementById('headerGoalText');
      if (MOCK_DATA.meta.goal) {
        goalEl.style.display = '';
        goalText.textContent = MOCK_DATA.meta.goal;
        goalEl.title = MOCK_DATA.meta.goal;
      } else {
        goalEl.style.display = 'none';
      }
    }

    function confidenceLevel(c) {
      if (c == null) return null;
      if (c >= 0.85) return 'high';
      if (c >= 0.60) return 'mid';
      return 'low';
    }

    function renderThumbnails() {
      const strip = document.getElementById('thumbnailStrip');
      strip.innerHTML = '';
      MOCK_DATA.slides.forEach((slide, idx) => {
        const thumb = document.createElement('div');
        const level = confidenceLevel(slide.mappingConfidence);
        const classes = ['thumbnail'];
        if (idx === state.currentSlideIdx) classes.push('active');
        if (level) classes.push('conf-' + level);
        thumb.className = classes.join(' ');
        const confBar = (slide.mappingConfidence != null) ? `
          <div class="thumb-confidence" title="信頼度 ${slide.mappingConfidence.toFixed(2)}">
            <div class="thumb-confidence-fill" style="width: ${slide.mappingConfidence * 100}%"></div>
          </div>` : '';
        thumb.innerHTML = `
          <div class="thumb-meta">
            <span class="thumb-num">${String(idx + 1).padStart(2, '0')}</span>
            <span class="thumb-dur">${escapeHtml(slide.duration || '')}</span>
          </div>
          <div class="thumb-title">${escapeHtml(slide.title)}</div>
          ${confBar}
        `;
        thumb.addEventListener('click', () => goToSlide(idx));
        strip.appendChild(thumb);
      });
    }

    function renderSlide() {
      const slide = MOCK_DATA.slides[state.currentSlideIdx];
      const total = MOCK_DATA.slides.length;
      document.getElementById('paneTitle').textContent = MOCK_DATA.meta.files.slides;
      document.getElementById('slideCounter').textContent = `${String(state.currentSlideIdx + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
      document.getElementById('prevBtn').disabled = state.currentSlideIdx === 0;
      document.getElementById('nextBtn').disabled = state.currentSlideIdx === total - 1;

      // Confidence chip in pane header
      const chip = document.getElementById('slideConfChip');
      const level = confidenceLevel(slide.mappingConfidence);
      if (level) {
        chip.style.display = '';
        chip.className = 'conf-chip ' + level;
        document.getElementById('confChipValue').textContent =
          slide.mappingConfidence.toFixed(2);
      } else {
        chip.style.display = 'none';
      }

      const view = document.getElementById('slideView');
      view.className = 'slide template-' + slide.template;
      view.innerHTML = `
        <div class="slide-head">
          <div class="slide-head-eyebrow">${escapeHtml(slide.duration || '')}</div>
          <div class="slide-title">${escapeHtml(slide.title)}</div>
          <div class="slide-subtitle">${escapeHtml(slide.subtitle || '')}</div>
        </div>
        <div class="slide-body">${renderSlideBody(slide)}</div>
      `;
    }

    function renderSlideBody(slide) {
      const c = slide.content;
      switch (slide.template) {
        case 'image':
          return `<div class="pdf-page"><img src="${c.imageUrl}" alt="${escapeHtml(slide.title)}"/></div>`;
        case 'text':
          return `<div class="text-slide-body">${(c.paragraphs || []).map(p => `<p>${escapeHtml(p)}</p>`).join('')}</div>`;
        case 'agenda':
          return `<div class="agenda-list">${
            c.items.map((it, i) => `
              <div class="agenda-item">
                <div class="agenda-num">${String(i + 1).padStart(2, '0')}</div>
                <div>${escapeHtml(it)}</div>
              </div>
            `).join('')
          }</div>`;
        case 'issues':
          return `<div class="issue-grid">${
            c.items.map(it => `
              <div class="issue-card">
                <div class="issue-icon">${svgIcon(it.icon, 16)}</div>
                <div class="issue-name">${escapeHtml(it.name)}</div>
                <div class="issue-desc">${escapeHtml(it.desc)}</div>
              </div>
            `).join('')
          }</div>`;
        case 'features':
          return `<div class="feature-grid">${
            c.items.map(it => `
              <div class="feature-card">
                <div class="feature-icon">${svgIcon(it.icon, 22)}</div>
                <div class="feature-name">${escapeHtml(it.name)}</div>
                <div class="feature-desc">${escapeHtml(it.desc)}</div>
              </div>
            `).join('')
          }</div>`;
        case 'case':
          return `
            <div class="case-content">
              <div class="case-logo">${svgIcon(c.company, 36)}</div>
              <div class="case-stats">${
                c.stats.map(s => `
                  <div class="stat-card">
                    <div class="stat-value">${escapeHtml(s.value)}</div>
                    <div class="stat-label">${escapeHtml(s.label)}</div>
                  </div>
                `).join('')
              }</div>
            </div>
          `;
        case 'pricing':
          return `
            <div class="pricing-grid">
              <div class="price-main">
                <div class="price-eyebrow">Estimated</div>
                <div class="price-amount">${escapeHtml(c.amount)}</div>
                <div class="price-unit">${escapeHtml(c.unit)}</div>
              </div>
              <div class="price-side">${
                c.sideItems.map(it => `
                  <div class="price-row">
                    <div class="price-row-label">${escapeHtml(it.label)}</div>
                    <div class="price-row-value">${escapeHtml(it.value)}</div>
                  </div>
                `).join('')
              }</div>
            </div>
          `;
        default: return '';
      }
    }

    function renderTranscript() {
      const slide = MOCK_DATA.slides[state.currentSlideIdx];
      const list = document.getElementById('transcriptList');
      const conf = slide.mappingConfidence;
      const level = confidenceLevel(conf);
      let warningHtml = '';
      if (level === 'low' || level === 'mid') {
        const isSevere = level === 'low';
        warningHtml = `
          <div class="conf-warning${isSevere ? ' severe' : ''}">
            <div class="conf-warning-icon">${svgIcon('i-alert', 16)}</div>
            <div>
              <strong>このスライドと音声の対応推定は信頼度 ${Math.round(conf * 100)}% です。</strong>
              ${slide.mappingNote ? '<br>' + escapeHtml(slide.mappingNote) : ''}
              ${isSevere ? `
                <div class="conf-warning-actions">
                  <span class="conf-action-pill">代替候補を表示</span>
                  <span class="conf-action-pill">手動で再マッピング</span>
                </div>` : ''}
            </div>
          </div>
        `;
      }
      list.innerHTML = warningHtml + slide.transcript.map((u, i) => `
        <div class="utterance ${u.hasFeedback ? 'has-feedback' : ''}" data-idx="${i}">
          <div class="speaker-badge ${u.speaker}">
            ${u.speaker === 'sales' ? '営業' : u.speaker === 'customer' ? '顧客' : 'sys'}
          </div>
          <div class="utterance-body">
            <div class="utterance-meta">
              <span class="speaker-name">${escapeHtml(u.name)}</span>
              <span class="utterance-time">${escapeHtml(u.time)}</span>
            </div>
            <div class="utterance-text">${escapeHtml(u.text)}</div>
          </div>
        </div>
      `).join('');
      document.getElementById('transcriptCount').textContent = slide.transcript.length;
    }

    function renderFeedback() {
      const slide = MOCK_DATA.slides[state.currentSlideIdx];
      const fb = slide.feedback;
      const improveList = fb.improve.map(i => {
        const t = typeof i === 'string' ? { text: i } : i;
        return `<li${t.urgent ? ' class="urgent"' : ''}>${escapeHtml(t.text)}</li>`;
      }).join('');

      document.getElementById('feedbackContent').innerHTML = `
        <div class="fb-section">
          <div class="fb-eyebrow good">${svgIcon('i-check', 12)}<span>Strengths</span></div>
          <div class="fb-block good">
            <ul class="fb-list">${fb.good.map(g => `<li>${escapeHtml(g)}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="fb-section">
          <div class="fb-eyebrow improve">${svgIcon('i-alert', 12)}<span>Opportunities</span></div>
          <div class="fb-block improve">
            <ul class="fb-list">${improveList}</ul>
          </div>
        </div>
        <div class="fb-section">
          <div class="fb-eyebrow suggest">${svgIcon('i-bulb', 12)}<span>Suggested Script</span></div>
          <div class="script-quote">${escapeHtml(fb.suggestedScript)}</div>
        </div>
      `;
    }

    /* ============================================================
       Scenario dashboard — シナリオ tab
       Single-screen view of the account-level Scenario state:
       extracted issue tree × stakeholder agreement matrix,
       emerged issues, AI-suggested deck updates.
       ============================================================ */
    const TYPE_META = {
      'AS-IS':       { cls: 't-as',    label: 'AS-IS' },
      'TO-BE':       { cls: 't-to',    label: 'TO-BE' },
      '解決策':       { cls: 't-sol',   label: '解決策' },
      'ROI':         { cls: 't-roi',   label: 'ROI'   },
      'スケジュール':  { cls: 't-sch',   label: 'スケジュール' },
      'リスク':       { cls: 't-risk',  label: 'リスク' },
      '競合':         { cls: 't-comp',  label: '競合' },
      '機会':         { cls: 't-other', label: '機会' },
      '権限/プロセス':{ cls: 't-other', label: '権限/プロセス' }
    };
    const STATE_GLYPH = { agreed: '✓', partial: '△', negative: '✕', unknown: '？', interested: '◎', concern: '!' };
    const ROLE_CLS = { 'Champion': 'champion', 'Economic Buyer': 'eb', 'User': 'blocker', 'Coach': '' };

    function cellFor(pos) {
      if (!pos) return `<span class="scen-cell unknown" title="未確認">${STATE_GLYPH.unknown}</span>`;
      const cls = pos.state || 'unknown';
      const glyph = STATE_GLYPH[cls] || STATE_GLYPH.unknown;
      const ev = pos.evidence ? ` — ${pos.evidence}` : '';
      return `<span class="scen-cell ${cls}" title="${escapeHtml(cls)}${escapeHtml(ev)}">${glyph}</span>`;
    }

    function renderScenario() {
      const S = SCENARIO_DATA;
      const stakes = S.stakeholders;
      const metCount = stakes.filter(s => s.lastContact).length;

      const headerHtml = `
        <div class="scen-dash-header">
          <div class="scen-dash-header-top">
            <span class="scen-dash-title">${escapeHtml(S.title)}</span>
            <span class="scen-dash-version">DECK v${S.currentDeckVersion}</span>
          </div>
          <div class="scen-dash-account">${escapeHtml(S.accountName)} · ${escapeHtml(S.accountMeta)}</div>
          <div class="scen-dash-metrics">
            <div class="scen-dash-metric">
              <div class="scen-dash-metric-label">合意度</div>
              <div class="scen-dash-metric-val">${Math.round(S.agreementScore * 100)}%
                <span class="scen-dash-metric-delta">${S.agreementDelta >= 0 ? '↑+' : '↓'}${Math.round(Math.abs(S.agreementDelta) * 100)}pt</span>
              </div>
              <div class="scen-dash-metric-sub">前回Session比</div>
            </div>
            <div class="scen-dash-metric">
              <div class="scen-dash-metric-label">論点数 (デッキ抽出)</div>
              <div class="scen-dash-metric-val">${S.issues.length}</div>
              <div class="scen-dash-metric-sub">新規論点 ${S.emergedIssues.length} 件浮上</div>
            </div>
            <div class="scen-dash-metric">
              <div class="scen-dash-metric-label">関係者</div>
              <div class="scen-dash-metric-val">${metCount} / ${stakes.length}</div>
              <div class="scen-dash-metric-sub">${stakes.length - metCount} 名未接触</div>
            </div>
            <div class="scen-dash-metric">
              <div class="scen-dash-metric-label">Session</div>
              <div class="scen-dash-metric-val">${S.sessions.length}</div>
              <div class="scen-dash-metric-sub">Deck v${S.currentDeckVersion} 使用中</div>
            </div>
          </div>
        </div>
      `;

      // Stakeholder cards
      const stakeHtml = `
        <div class="scen-dash-section">
          <div class="scen-dash-section-head">
            <span class="scen-dash-section-title">バイイングセンター</span>
            <span class="scen-dash-section-sub">未接触の決裁関係者を可視化</span>
            <span class="scen-dash-section-count">${stakes.length}名</span>
          </div>
          <div class="scen-stake-list">
            ${stakes.map(s => `
              <div class="scen-stake-card ${s.lastContact ? '' : 'unmet'}">
                <div class="scen-stake-card-name">${escapeHtml(s.name)}</div>
                <div class="scen-stake-card-role ${ROLE_CLS[s.role] || ''}">${escapeHtml(s.role.toUpperCase())}</div>
                <div class="scen-stake-card-meta ${s.lastContact ? '' : 'unmet'}">${s.lastContact ? '最終接触 ' + escapeHtml(s.lastContact) : '⚠ 一度も接触なし'}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // Issue × Stakeholder matrix
      const matrixHeaderCells = stakes.map(s => {
        const roleCls = ROLE_CLS[s.role] || '';
        return `<th><div class="scen-matrix-stake-head ${roleCls}">
          <span class="scen-matrix-stake-name">${escapeHtml(s.shortName)}</span>
          <span class="scen-matrix-stake-role">${escapeHtml(s.role.toUpperCase())}</span>
        </div></th>`;
      }).join('');

      // Group issues by type for visual grouping
      const typeOrder = ['AS-IS', 'TO-BE', '解決策', 'ROI', 'スケジュール'];
      const groupedRows = typeOrder.flatMap(t => {
        const items = S.issues.filter(i => i.type === t);
        return items.map(i => {
          const tmeta = TYPE_META[i.type] || TYPE_META['AS-IS'];
          const cells = stakes.map(s => `<td>${cellFor(i.positions[s.id])}</td>`).join('');
          const negativeOrConcern = stakes.some(s => i.positions[s.id] && (i.positions[s.id].state === 'negative'));
          return `
            <tr class="scen-matrix-row ${negativeOrConcern ? 'has-blocker' : ''}">
              <td class="scen-matrix-issue-cell">
                <span class="scen-matrix-type-chip ${tmeta.cls}">${escapeHtml(tmeta.label)}</span>
                <div class="scen-matrix-issue-title">${escapeHtml(i.title)}</div>
                <div class="scen-matrix-issue-sub">${escapeHtml(i.summary)} · P.${i.sourceSlides.join(', P.')}</div>
              </td>
              ${cells}
            </tr>
          `;
        });
      }).join('');

      const matrixHtml = `
        <div class="scen-dash-section">
          <div class="scen-dash-section-head">
            <span class="scen-dash-section-title">論点 × 関係者 合意度マトリックス</span>
            <span class="scen-dash-section-sub">デッキから抽出した論点に対する各関係者の反応</span>
            <span class="scen-dash-section-count">${S.issues.length} 論点</span>
          </div>
          <div class="scen-matrix">
            <table class="scen-matrix-table">
              <thead>
                <tr>
                  <th class="scen-matrix-issue-col">論点 (デッキ抽出)</th>
                  ${matrixHeaderCells}
                </tr>
              </thead>
              <tbody>
                ${groupedRows}
              </tbody>
            </table>
          </div>
          <div style="display:flex;gap:14px;margin-top:10px;font-size:10.5px;color:var(--text-muted);flex-wrap:wrap;">
            <span><span class="scen-cell agreed" style="width:16px;height:16px;font-size:11px;">✓</span> 合意</span>
            <span><span class="scen-cell partial" style="width:16px;height:16px;font-size:11px;">△</span> 部分合意</span>
            <span><span class="scen-cell negative" style="width:16px;height:16px;font-size:11px;">✕</span> 反対/ネガ</span>
            <span><span class="scen-cell unknown" style="width:16px;height:16px;font-size:11px;">？</span> 未確認</span>
          </div>
        </div>
      `;

      // Emerged issues
      const emergedHtml = `
        <div class="scen-dash-section">
          <div class="scen-dash-section-head">
            <span class="scen-dash-section-title">新規論点 (デッキ外で浮上)</span>
            <span class="scen-dash-section-sub">商談から検出された、提案資料に未反映の論点</span>
            <span class="scen-dash-section-count">${S.emergedIssues.length}</span>
          </div>
          <div class="scen-emerged-list">
            ${S.emergedIssues.map(e => `
              <div class="scen-emerged-item">
                <div class="scen-emerged-head">
                  <span class="scen-emerged-type">${escapeHtml(e.type)}</span>
                  <span class="scen-emerged-title">${escapeHtml(e.title)}</span>
                  <span class="scen-emerged-sev ${e.severity}">${e.severity === 'high' ? '重要度: 高' : '重要度: 中'}</span>
                </div>
                <div class="scen-emerged-evidence">"${escapeHtml(e.evidence)}"</div>
                <div class="scen-emerged-action">
                  <span class="scen-emerged-action-arrow">→</span>
                  <span>${escapeHtml(e.suggestedAction)}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // Update proposals
      const proposalsHtml = `
        <div class="scen-dash-section">
          <div class="scen-dash-section-head">
            <span class="scen-dash-section-title">シナリオ軌道修正 (AI推奨)</span>
            <span class="scen-dash-section-sub">次版デッキ修正 + 次回Session方針</span>
            <span class="scen-dash-section-count">${S.updateProposals.length}</span>
          </div>
          <div class="scen-prop-list">
            ${S.updateProposals.map(p => `
              <div class="scen-prop-item">
                <span class="scen-prop-prio ${p.priority}">${p.priority === 'high' ? 'P1' : 'P2'}</span>
                <span class="scen-prop-type">${escapeHtml(p.type === 'deck_add' ? 'デッキ追加' : p.type === 'meeting' ? 'Session方針' : 'デッキ修正')}</span>
                <div class="scen-prop-body">
                  <div class="scen-prop-title">${escapeHtml(p.title)}${p.targetVersion ? `<span class="scen-prop-target">→ ${escapeHtml(p.targetVersion)}</span>` : ''}</div>
                  <div class="scen-prop-reason">${escapeHtml(p.reason)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('summaryContent').innerHTML = `
        <div class="scen-dash">
          ${headerHtml}
          ${stakeHtml}
          ${matrixHtml}
          ${emergedHtml}
          ${proposalsHtml}
        </div>
      `;
    }

    /* ============================================================
       Scenario update hero — top of workspace
       Replaces the old "Next Actions" checklist. Shows the Scenario
       diff that came out of this Session: which論点 progressed, which
       regressed, what emerged that wasn't in the deck, and which deck
       updates the AI recommends for the next version.
       ============================================================ */
    function findIssue(id) {
      return SCENARIO_DATA.issues.find(x => x.id === id)
          || SCENARIO_DATA.emergedIssues.find(x => x.id === id);
    }

    function renderScenarioHero() {
      const hero = document.getElementById('scenHero');
      const su = SCENARIO_DATA.sessionUpdate;
      const score = SCENARIO_DATA.agreementScore;
      const delta = SCENARIO_DATA.agreementDelta;

      const progressedHtml = su.progressed.length
        ? su.progressed.map(p => {
            const issue = findIssue(p.issueId);
            return `<div class="scen-hero-item" data-issue="${escapeHtml(p.issueId)}">
              <span class="scen-hero-item-marker">↑</span>
              <span class="scen-hero-item-text"><strong>${escapeHtml(issue ? issue.title : p.issueId)}</strong><br>${escapeHtml(p.summary)}</span>
            </div>`;
          }).join('')
        : '<div class="scen-hero-empty">なし</div>';

      const regressedHtml = su.regressed.length
        ? su.regressed.map(r => {
            const issue = findIssue(r.issueId);
            return `<div class="scen-hero-item" data-issue="${escapeHtml(r.issueId)}">
              <span class="scen-hero-item-marker">↓</span>
              <span class="scen-hero-item-text"><strong>${escapeHtml(issue ? issue.title : r.issueId)}</strong><br>${escapeHtml(r.summary)}</span>
            </div>`;
          }).join('')
        : '<div class="scen-hero-empty">なし</div>';

      const emergedHtml = su.emerged.length
        ? su.emerged.map(eid => {
            const e = SCENARIO_DATA.emergedIssues.find(x => x.id === eid);
            if (!e) return '';
            return `<div class="scen-hero-item" data-emerged="${escapeHtml(eid)}">
              <span class="scen-hero-item-marker">＋</span>
              <span class="scen-hero-item-text"><strong>${escapeHtml(e.title)}</strong><br>${escapeHtml(e.evidence)}</span>
            </div>`;
          }).join('')
        : '<div class="scen-hero-empty">なし</div>';

      const propsTop = SCENARIO_DATA.updateProposals.filter(p => p.priority === 'high').slice(0, 3);
      const proposalsHtml = propsTop.length
        ? propsTop.map(p => `
            <div class="scen-hero-item">
              <span class="scen-hero-item-marker">▸</span>
              <span class="scen-hero-item-text"><strong>${escapeHtml(p.title)}</strong><br>${escapeHtml(p.reason)}</span>
            </div>`).join('')
        : '<div class="scen-hero-empty">なし</div>';

      hero.innerHTML = `
        <div class="scen-hero-head">
          <span class="eyebrow">Scenario Update</span>
          <span class="scen-hero-title">${escapeHtml(SCENARIO_DATA.title)} — 今回Sessionで何が変わったか</span>
          <span class="scen-hero-scoreshift">
            <span class="scen-hero-scoreshift-label">合意度</span>
            <span class="scen-hero-scoreshift-val">${Math.round(score * 100)}%</span>
            <span class="scen-hero-scoreshift-delta">${delta >= 0 ? '↑+' : '↓'}${Math.round(Math.abs(delta) * 100)}pt</span>
          </span>
        </div>
        <div class="scen-hero-grid">
          <div class="scen-hero-col progressed">
            <div class="scen-hero-col-head">
              <span class="scen-hero-col-head-dot"></span>
              <span class="scen-hero-col-head-label">進展した論点</span>
              <span class="scen-hero-col-head-count">${su.progressed.length}</span>
            </div>
            ${progressedHtml}
          </div>
          <div class="scen-hero-col regressed">
            <div class="scen-hero-col-head">
              <span class="scen-hero-col-head-dot"></span>
              <span class="scen-hero-col-head-label">後退/障害</span>
              <span class="scen-hero-col-head-count">${su.regressed.length}</span>
            </div>
            ${regressedHtml}
          </div>
          <div class="scen-hero-col emerged">
            <div class="scen-hero-col-head">
              <span class="scen-hero-col-head-dot"></span>
              <span class="scen-hero-col-head-label">新規論点</span>
              <span class="scen-hero-col-head-count">${su.emerged.length}</span>
            </div>
            ${emergedHtml}
          </div>
          <div class="scen-hero-col proposals">
            <div class="scen-hero-col-head">
              <span class="scen-hero-col-head-dot"></span>
              <span class="scen-hero-col-head-label">次版デッキ修正</span>
              <span class="scen-hero-col-head-count">${propsTop.length}</span>
            </div>
            ${proposalsHtml}
          </div>
        </div>
      `;

      // Clicking a progressed/regressed item jumps to the source slide
      hero.querySelectorAll('.scen-hero-item[data-issue]').forEach(el => {
        el.addEventListener('click', () => {
          const issueId = el.dataset.issue;
          const issue = findIssue(issueId);
          if (!issue || !issue.sourceSlides || !issue.sourceSlides.length) return;
          const slideIdx = issue.sourceSlides[0] - 1;
          goToSlide(slideIdx);
          switchTab('feedback');
          document.querySelector('.workspace').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
      // Emerged items jump to the Scenario tab where they're elaborated
      hero.querySelectorAll('.scen-hero-item[data-emerged]').forEach(el => {
        el.addEventListener('click', () => {
          switchTab('summary');
          document.getElementById('section-summary').scrollIntoView({ behavior: 'smooth' });
        });
      });
    }

    /* ============================================================
       Interactions
       ============================================================ */
    function goToSlide(idx) {
      if (idx < 0 || idx >= MOCK_DATA.slides.length) return;
      state.currentSlideIdx = idx;
      renderThumbnails();
      renderSlide();
      renderTranscript();
      renderFeedback();
    }

    function switchTab(tab) {
      state.currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      document.querySelectorAll('.pane-section').forEach(s => {
        s.classList.toggle('active', s.id === `section-${tab}`);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader();
      renderThumbnails();
      renderScenarioHero();
      renderSlide();
      renderTranscript();
      renderFeedback();
      renderScenario();

      document.getElementById('prevBtn').addEventListener('click', () => goToSlide(state.currentSlideIdx - 1));
      document.getElementById('nextBtn').addEventListener('click', () => goToSlide(state.currentSlideIdx + 1));
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.addEventListener('click', () => switchTab(b.dataset.tab));
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') goToSlide(state.currentSlideIdx - 1);
        if (e.key === 'ArrowRight') goToSlide(state.currentSlideIdx + 1);
      });

      document.getElementById('analyzeBtn').addEventListener('click', handleAnalyzeClick);
      document.getElementById('slideUpload').addEventListener('click', () => handleUploadClick('slides'));
      document.getElementById('audioUpload').addEventListener('click', () => handleUploadClick('audio'));

      // New session flow
      populateDealSelector();
      document.getElementById('newSessionBtn').addEventListener('click', openNewSessionModal);
      document.getElementById('newSessionClose').addEventListener('click', closeNewSessionModal);
      document.getElementById('newSessionCancel').addEventListener('click', closeNewSessionModal);
      document.querySelector('#newSessionModal .modal-overlay').addEventListener('click', closeNewSessionModal);
      document.getElementById('dealSelector').addEventListener('change', (e) => selectDealInModal(e.target.value));
      document.getElementById('modalSlidePicker').addEventListener('click', () => handleModalFilePick('slides'));
      document.getElementById('modalAudioPicker').addEventListener('click', () => handleModalFilePick('audio'));
      document.getElementById('newSessionStart').addEventListener('click', startNewSession);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('newSessionModal').classList.contains('open')) {
          closeNewSessionModal();
        }
      });

      // Warm up the server config so the first Picker click feels instant
      drive.loadConfig();
    });
  </script>
</body>
</html>
