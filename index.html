<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalesCoach | 商談分析ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ===== Surface — Tonal Layering ===== */
      --surface-lowest:  #ffffff;
      --surface-low:     #f6f3f4;
      --surface:         #fcf8f9;
      --surface-high:    #eae7e8;
      --surface-highest: #dedddd;
      --surface-bright:  #d2d0d1;

      /* ===== Brand — Teal Spectrum ===== */
      --primary:              #36A191;
      --on-primary:           #ffffff;
      --primary-dark:         #297A6E;
      --primary-light:        rgba(54,161,145,0.08);
      --primary-fixed:        #5BC8B8;
      --primary-fixed-dim:    #94DBD1;
      --primary-container:    #297A6E;
      --on-primary-container: #CDEEE9;
      --secondary:            #36A191;
      --secondary-container:  #CDEEE9;
      --on-secondary-container:#297A6E;
      --tertiary:             #b04c00;

      /* ===== Typography Color ===== */
      --on-surface:           #1b1b1c;
      --on-surface-variant:   #5a6660;
      --text-muted:           #8a968a;

      /* ===== Ghost Border ===== */
      --outline:         #6e7a6f;
      --outline-variant: #bdcabd;
      --ghost-border:    rgba(189,202,189,0.20);

      /* ===== Status ===== */
      --danger:        #ba1a1a;
      --danger-weak:   rgba(186, 26, 26, 0.14);
      --warning-bg:    rgba(188,114,0,0.08);
      --warning-border:#b07000;
      --warning-accent:#c88000;
      --warning-text:  #5e3e00;
      --success:       #36A191;
      --success-weak:  rgba(54,161,145,0.14);
      --done-bg:       rgba(54,161,145,0.09);
      --done-text:     #297A6E;
      --delay-bg:      rgba(168,54,0,0.09);
      --delay-text:    #7e3000;

      /* ===== Pipeline ===== */
      --c-創注: #78CBCA;
      --c-D:    #5ABFC0;
      --c-C:    #46A9B8;
      --c-B:    #3890AE;
      --c-A:    #2878A4;
      --c-失注: #c5c4c5;

      /* ===== Radius ===== */
      --r-sm: 4px;
      --r:    6px;
      --r-lg: 8px;
      --r-xl: 12px;

      /* ===== Typography Scale ===== */
      --text-xs:   0.6875rem;
      --text-sm:   0.75rem;
      --text-base: 0.875rem;
      --text-md:   1.0rem;

      /* ===== Spacing ===== */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 24px;

      /* ===== Transitions ===== */
      --dur-fast: 0.1s;
      --dur-base: 0.18s;
      --dur-slow: 0.28s;

      /* ===== Elevation — Atmospheric Shadow ===== */
      --shadow-sm:    0px 4px 12px  rgba(0,39,117,0.04);
      --shadow-md:    0px 12px 24px rgba(0,39,117,0.05);
      --shadow-lg:    0px 20px 40px rgba(0,39,117,0.06);
      --shadow-float: 0px 24px 48px rgba(0,39,117,0.06);

      /* ===== Mono Font ===== */
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* ===== Slide viewport ===== */
      --slide-stage: #1b1b1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: var(--surface);
      color: var(--on-surface);
      font-size: var(--text-base);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      overflow: hidden;
    }
    h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .tabular { font-variant-numeric: tabular-nums; }
    .mono    { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Eyebrow — uppercase mono label sitting above titles */
    .eyebrow {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ============ HEADER ============ */
    .app-header {
      background: var(--surface-lowest);
      border-bottom: 1px solid var(--ghost-border);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky; top: 0; z-index: 100;
    }
    .brand-cluster { display: flex; align-items: center; gap: 16px; }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 24px; height: 24px;
      border-radius: var(--r);
      background: var(--primary);
      color: var(--on-primary);
      display: grid; place-items: center;
      font: 700 11px var(--font-mono);
    }
    .breadcrumb {
      color: var(--text-muted);
      font-size: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .breadcrumb-sep { color: var(--text-muted); opacity: 0.5; }
    .breadcrumb-current { color: var(--on-surface); font-weight: 500; }

    .header-right {
      display: flex; align-items: center; gap: 16px;
      font-size: 12px;
      color: var(--on-surface-variant);
    }
    .header-meta { display: flex; align-items: center; gap: 12px; }
    .header-meta-item { display: flex; align-items: center; gap: 6px; }
    .header-meta-label { color: var(--text-muted); font-size: 11px; }
    .header-meta-value { color: var(--on-surface); font-weight: 500; }

    .topbar-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg, var(--c-B), var(--c-A));
      color: #fff;
      font: 700 10px 'Inter', sans-serif;
      display: grid; place-items: center;
      letter-spacing: -0.02em;
      cursor: pointer;
    }

    /* ============ LAYOUT ============ */
    .app-main {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
      background: var(--surface);
    }

    /* ============ UPLOAD BAR ============ */
    .upload-bar {
      background: var(--surface-lowest);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .upload-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface-low);
      border-radius: var(--r);
      font-size: 12px;
      transition: background var(--dur-base);
      min-width: 220px;
      cursor: pointer;
    }
    .upload-card:hover { background: var(--surface-high); }
    .upload-icon {
      width: 32px; height: 32px;
      background: var(--surface-lowest);
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .upload-info {
      display: flex; flex-direction: column;
      flex: 1;
      min-width: 0;
      gap: 1px;
    }
    .upload-label {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .upload-filename {
      font-size: 12px;
      font-weight: 500;
      color: var(--on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .upload-card.swapped { background: var(--primary-light); }
    .upload-card.swapped .upload-icon { color: var(--primary-dark); }
    .upload-status {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      margin-left: 4px;
      border-radius: var(--r-sm);
      font: 700 9.5px/1.4 var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--warning-bg);
      color: var(--warning-text);
      vertical-align: 1px;
    }

    /* Button — Primary */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px;
      border-radius: var(--r);
      font: 600 13px/1.4 'Inter', 'Noto Sans JP', sans-serif;
      letter-spacing: 0.01em;
      transition: background var(--dur-base);
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn.is-loading { pointer-events: none; opacity: 0.75; }
    .btn.is-loading .btn-spinner {
      width: 12px; height: 12px;
      border: 1.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-outline {
      background: var(--surface-lowest);
      color: var(--on-surface-variant);
      border: 1px solid var(--outline-variant);
    }
    .btn-outline:hover { background: var(--surface-high); border-color: var(--outline); }
    .btn-sm { padding: 5px 12px; font-size: 11px; }

    .meta-info {
      margin-left: auto;
      display: flex; align-items: center;
      gap: 20px;
    }
    .meta-info-block { display: flex; flex-direction: column; gap: 1px; }

    /* ============ THUMBNAIL STRIP ============ */
    .thumbnail-strip {
      background: var(--surface);
      padding: 8px 20px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .thumbnail {
      flex-shrink: 0;
      width: 168px;
      min-height: 72px;
      background: var(--surface-lowest);
      border-radius: var(--r-lg);
      cursor: pointer;
      transition: background var(--dur-base);
      overflow: hidden;
      position: relative;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .thumbnail:hover { background: var(--surface-high); }
    .thumbnail.active {
      background: var(--surface-lowest);
      box-shadow: inset 0 0 0 2px var(--primary);
    }
    .thumb-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .thumb-num {
      width: 22px; height: 22px;
      background: var(--surface-low);
      color: var(--on-surface-variant);
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      font: 700 11px/1 var(--font-mono);
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .thumbnail.active .thumb-num {
      background: var(--primary);
      color: var(--on-primary);
    }
    .thumb-dur {
      font: 500 10px/1 var(--font-mono);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .thumb-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--on-surface);
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ============ WORKSPACE ============ */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 12px;
      padding: 0 20px 20px;
      overflow: hidden;
      min-height: 0;
    }
    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 1fr; }
    }

    /* ----- Slide pane (the panel that hosts the slide viewer) ----- */
    .slide-pane {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .slide-pane-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px;
      gap: 12px;
      min-height: 56px;
    }
    .slide-pane-hd-left { display: flex; flex-direction: column; gap: 2px; }
    .slide-pane-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }
    .slide-stage {
      flex: 1;
      background: var(--slide-stage);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 0;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      max-width: 760px;
      aspect-ratio: 16 / 9;
      background: var(--surface-lowest);
      border-radius: var(--r-lg);
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideIn var(--dur-slow) ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-head { margin-bottom: 22px; }
    .slide-head-eyebrow {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .slide-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--on-surface);
      letter-spacing: -0.015em;
      line-height: 1.25;
    }
    .slide-subtitle {
      font-size: 12px;
      color: var(--on-surface-variant);
      margin-top: 4px;
    }
    .slide-body { flex: 1; overflow: hidden; }

    /* Slide content variants — all use Tonal Layering, no shadows */
    .agenda-list { display: flex; flex-direction: column; gap: 8px; }
    .agenda-item {
      display: flex; align-items: center; gap: 14px;
      padding: 11px 14px;
      background: var(--surface-low);
      border-radius: var(--r);
      font-size: 14px;
    }
    .agenda-num {
      width: 24px; height: 24px;
      background: var(--primary);
      color: var(--on-primary);
      border-radius: 50%;
      display: grid; place-items: center;
      font: 700 11px var(--font-mono);
      flex-shrink: 0;
    }

    .issue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .issue-card {
      padding: 12px 14px;
      background: var(--surface-low);
      border-radius: var(--r);
      position: relative;
      padding-left: 16px;
    }
    .issue-card::before {
      content: '';
      position: absolute;
      left: 0; top: 14px; bottom: 14px;
      width: 3px;
      background: var(--warning-border);
      border-radius: 2px;
    }
    .issue-icon { color: var(--warning-border); margin-bottom: 6px; }
    .issue-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .issue-desc { font-size: 11px; color: var(--on-surface-variant); }

    .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .feature-card {
      padding: 14px;
      background: var(--primary-light);
      border-radius: var(--r-lg);
      text-align: center;
    }
    .feature-icon {
      color: var(--primary-dark);
      margin: 0 auto 8px;
      display: grid; place-items: center;
    }
    .feature-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--on-surface); }
    .feature-desc { font-size: 10.5px; color: var(--on-surface-variant); line-height: 1.5; }

    .case-content { display: flex; gap: 20px; align-items: center; }
    .case-logo {
      width: 84px; height: 84px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      display: grid; place-items: center;
      color: var(--on-surface-variant);
      flex-shrink: 0;
    }
    .case-stats { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; }
    .stat-card {
      padding: 16px 12px;
      background: var(--done-bg);
      border-radius: var(--r-lg);
      flex: 1;
      min-width: 110px;
      text-align: center;
    }
    .stat-value {
      font: 700 26px/1 'Inter', sans-serif;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .stat-label { font-size: 11px; color: var(--on-surface-variant); margin-top: 6px; }

    .pricing-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    .price-main {
      padding: 22px;
      background: var(--primary);
      color: var(--on-primary);
      border-radius: var(--r-lg);
    }
    .price-eyebrow {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--on-primary-container);
      margin-bottom: 8px;
    }
    .price-amount {
      font: 700 32px/1 'Inter', sans-serif;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .price-unit { font-size: 12px; opacity: 0.85; margin-top: 6px; }
    .price-side { display: flex; flex-direction: column; gap: 6px; }
    .price-row {
      padding: 10px 12px;
      background: var(--surface-low);
      border-radius: var(--r);
    }
    .price-row-label {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .price-row-value {
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* Slide nav */
    .slide-nav {
      padding: 10px 16px;
      background: var(--surface-lowest);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .nav-btn {
      width: 28px; height: 28px;
      border-radius: var(--r);
      background: var(--surface-low);
      color: var(--on-surface-variant);
      display: grid; place-items: center;
      transition: background var(--dur-base);
    }
    .nav-btn:hover { background: var(--surface-high); color: var(--on-surface); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .slide-counter {
      font: 600 12px var(--font-mono);
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      min-width: 64px;
      text-align: center;
    }

    /* ----- Content pane ----- */
    .content-pane {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .pane-tabs {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 44px;
      flex-shrink: 0;
      position: relative;
    }
    .pane-tabs::after {
      content: '';
      position: absolute;
      left: 16px; right: 16px; bottom: 0;
      height: 1px;
      background: var(--ghost-border);
    }
    .tab-btn {
      height: 44px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--on-surface-variant);
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color var(--dur-base);
    }
    .tab-btn:hover { color: var(--on-surface); }
    .tab-btn.active { color: var(--on-surface); font-weight: 600; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      left: 8px; right: 8px; bottom: -1px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
      z-index: 1;
    }
    .tab-badge {
      padding: 1px 6px;
      border-radius: var(--r-sm);
      background: var(--surface-low);
      color: var(--text-muted);
      font: 600 10px/1.4 var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .tab-btn.active .tab-badge {
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .tab-btn svg { color: currentColor; }

    .pane-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 24px;
      min-height: 0;
    }
    .pane-section { display: none; }
    .pane-section.active { display: block; }

    /* Transcript */
    .transcript-list { display: flex; flex-direction: column; gap: 4px; }
    .utterance {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--r);
      transition: background var(--dur-fast);
      cursor: pointer;
    }
    .utterance:hover { background: var(--primary-light); }
    .speaker-badge {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      font: 700 10px 'Inter', sans-serif;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .speaker-badge.sales { background: linear-gradient(135deg, var(--primary-fixed), var(--primary-dark)); }
    .speaker-badge.customer { background: linear-gradient(135deg, #9aa39d, #5a6660); }
    .utterance-body { flex: 1; min-width: 0; }
    .utterance-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .speaker-name { font-weight: 600; color: var(--on-surface); font-size: 12px; }
    .utterance-time {
      color: var(--text-muted);
      font: 500 10.5px var(--font-mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .utterance-text {
      font-size: 13px;
      color: var(--on-surface);
      line-height: 1.65;
    }
    .utterance.has-feedback .utterance-body {
      position: relative;
    }
    .utterance.has-feedback .utterance-body::after {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
      margin-left: 6px;
      vertical-align: middle;
      opacity: 0.6;
    }

    /* AI Feedback panels */
    .fb-section { margin-bottom: 16px; }
    .fb-section:last-child { margin-bottom: 0; }
    .fb-eyebrow {
      display: flex; align-items: center; gap: 8px;
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .fb-eyebrow.good { color: var(--done-text); }
    .fb-eyebrow.improve { color: var(--warning-border); }
    .fb-eyebrow.suggest { color: var(--primary-dark); }

    .fb-block {
      padding: 12px 14px;
      border-radius: var(--r-lg);
    }
    .fb-block.good { background: var(--done-bg); }
    .fb-block.improve { background: var(--warning-bg); }

    .fb-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .fb-list li {
      font-size: 12.5px;
      color: var(--on-surface);
      padding-left: 14px;
      position: relative;
      line-height: 1.6;
    }
    .fb-list li::before {
      content: '';
      position: absolute;
      left: 2px; top: 9px;
      width: 4px; height: 4px;
      background: currentColor;
      border-radius: 50%;
      opacity: 0.5;
    }
    .fb-list li.urgent {
      padding-left: 22px;
    }
    .fb-list li.urgent::before {
      content: '!';
      left: 2px; top: 0;
      width: 14px; height: 14px;
      background: var(--warning-accent);
      color: #fff;
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      font: 700 10px var(--font-mono);
      opacity: 1;
    }

    .script-quote {
      background: var(--surface-low);
      border-radius: var(--r-lg);
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--on-surface);
      position: relative;
      padding-left: 18px;
    }
    .script-quote::before {
      content: '';
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 3px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* Summary */
    .summary-section { margin-bottom: 24px; }
    .summary-section:last-child { margin-bottom: 0; }
    .summary-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }

    .score-card {
      display: flex; align-items: center; gap: 18px;
      padding: 16px;
      background: var(--primary-light);
      border-radius: var(--r-xl);
      margin-bottom: 20px;
    }
    .score-ring {
      width: 64px; height: 64px;
      position: relative;
      flex-shrink: 0;
    }
    .score-value {
      position: absolute;
      inset: 0;
      display: grid; place-items: center;
      font: 700 20px var(--font-mono);
      color: var(--primary-dark);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .score-text { flex: 1; }
    .score-text strong {
      display: block;
      font-size: 14px;
      color: var(--on-surface);
      margin-bottom: 4px;
    }
    .score-text span {
      font-size: 12px;
      color: var(--on-surface-variant);
      line-height: 1.55;
    }

    .phase-bar {
      display: flex;
      gap: 4px;
    }
    .phase-step {
      flex: 1;
      padding: 8px 6px;
      background: var(--surface-low);
      border-radius: var(--r);
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .phase-step.done {
      background: var(--done-bg);
      color: var(--done-text);
    }
    .phase-step.current {
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
    }

    .action-list { display: flex; flex-direction: column; gap: 6px; }
    .action-item {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      transition: background var(--dur-base);
    }
    .action-item:hover { background: var(--surface-high); }
    .action-check {
      width: 16px; height: 16px;
      border: 1.5px solid var(--outline-variant);
      border-radius: var(--r-sm);
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
      transition: border-color var(--dur-base);
    }
    .action-check:hover { border-color: var(--primary); }
    .action-content { flex: 1; min-width: 0; }
    .action-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--on-surface);
      margin-bottom: 4px;
    }
    .action-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--on-surface-variant);
    }
    .action-due {
      display: inline-flex; align-items: center; gap: 4px;
      font: 500 11px var(--font-mono);
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
    }
    .action-note { color: var(--text-muted); font-size: 11px; }

    .chip {
      display: inline-block;
      padding: 2px 6px;
      border-radius: var(--r-sm);
      font: 700 10px var(--font-mono);
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .chip-high { background: var(--danger-weak); color: var(--danger); }
    .chip-mid  { background: var(--warning-bg); color: var(--warning-text); }
    .chip-low  { background: var(--done-bg); color: var(--done-text); }
    .chip-info { background: var(--primary-light); color: var(--primary-dark); }

    .bant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bant-row {
      padding: 10px 12px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bant-row-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .bant-key {
      font: 700 11px var(--font-mono);
      color: var(--on-surface);
      letter-spacing: 0.04em;
    }
    .bant-key-sub {
      font: 500 10px var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .bant-note { font-size: 11.5px; color: var(--on-surface-variant); line-height: 1.55; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-highest); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--surface-bright); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .slide { animation: none !important; }
    }
  </style>
</head>

    /* ============================================================
       App state
       ============================================================ */
    const state = {
      currentSlideIdx: 0,
      currentTab: 'transcript'
    };

    /* ============================================================
       Helpers
       ============================================================ */
    function svgIcon(id, size = 14) {
      return `<svg width="${size}" height="${size}"><use href="#${id}"/></svg>`;
    }
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function formatBytes(b) {
      const n = parseInt(b, 10);
      if (!n) return '';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
      if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
      return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
    }

    /* ============================================================
       Google Drive Picker bridge
       Server (Code.gs) provides API key / project number and
       OAuth token; this module loads the Picker JS lazily and
       exposes drive.pick(kind) → Promise<file|null>.
       ============================================================ */
    const CONFIG = { apiKey: '', appId: '' };
    const pickedFiles = { slides: null, audio: null };

    const drive = (() => {
      let pickerLoaded = false;
      let configLoaded = false;

      function inGas() {
        return typeof google !== 'undefined' &&
               typeof google.script !== 'undefined' &&
               typeof google.script.run !== 'undefined';
      }

      function callServer(name, ...args) {
        return new Promise((resolve, reject) => {
          if (!inGas()) { reject(new Error('not_in_gas')); return; }
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            [name](...args);
        });
      }

      async function loadConfig() {
        if (configLoaded) return CONFIG;
        if (!inGas()) { configLoaded = true; return CONFIG; }
        try {
          const cfg = await callServer('getDriveConfig');
          if (cfg && cfg.apiKey && cfg.appId) {
            CONFIG.apiKey = cfg.apiKey;
            CONFIG.appId  = cfg.appId;
          }
        } catch (e) { /* leave CONFIG empty — caller will surface a setup message */ }
        configLoaded = true;
        return CONFIG;
      }

      function loadPickerScript() {
        if (pickerLoaded) return Promise.resolve();
        return new Promise((resolve, reject) => {
          const onReady = () => gapi.load('picker', () => { pickerLoaded = true; resolve(); });
          if (typeof gapi !== 'undefined') return onReady();
          const s = document.createElement('script');
          s.src = 'https://apis.google.com/js/api.js';
          s.onload = onReady;
          s.onerror = () => reject(new Error('picker_load_failed'));
          document.head.appendChild(s);
        });
      }

      const MIME_FILTERS = {
        slides: [
          'application/vnd.google-apps.presentation',
          'application/vnd.openxmlformats-officedocument.presentationml.presentation',
          'application/pdf'
        ].join(','),
        audio: [
          'audio/mpeg', 'audio/mp4', 'audio/wav', 'audio/x-m4a',
          'audio/ogg', 'audio/webm', 'video/mp4', 'video/webm'
        ].join(',')
      };

      async function pick(kind) {
        if (!inGas()) throw new Error('not_in_gas');
        await loadConfig();
        if (!CONFIG.apiKey || !CONFIG.appId) throw new Error('not_configured');
        await loadPickerScript();
        const oauthToken = await callServer('getOAuthToken');

        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setMimeTypes(MIME_FILTERS[kind])
          .setIncludeFolders(false)
          .setMode(google.picker.DocsViewMode.LIST);

        const title = kind === 'slides' ? '提案資料を選択' : '商談音声を選択';

        return new Promise((resolve) => {
          const picker = new google.picker.PickerBuilder()
            .setAppId(CONFIG.appId)
            .setOAuthToken(oauthToken)
            .setDeveloperKey(CONFIG.apiKey)
            .addView(view)
            .setTitle(title)
            .setCallback((data) => {
              if (data.action === google.picker.Action.PICKED) {
                resolve(data.docs[0]);
              } else if (data.action === google.picker.Action.CANCEL) {
                resolve(null);
              }
            })
            .build();
          picker.setVisible(true);
        });
      }

      return { inGas, loadConfig, pick, callServer };
    })();

    function updateUploadCard(kind, file) {
      const cardId = kind === 'slides' ? 'slideUpload' : 'audioUpload';
      const card = document.getElementById(cardId);
      const baseLabel = kind === 'slides' ? '提案資料' : '商談音声';
      const sizeStr = file.sizeBytes ? formatBytes(file.sizeBytes) : '';
      card.querySelector('.upload-label').textContent = baseLabel + (sizeStr ? ' · ' + sizeStr : '');
      card.querySelector('.upload-filename').innerHTML =
        escapeHtml(file.name) + ' <span class="upload-status">未分析</span>';
      card.classList.add('swapped');
    }

    async function handleUploadClick(kind) {
      try {
        const picked = await drive.pick(kind);
        if (!picked) return;
        let meta = {
          id: picked.id, name: picked.name,
          mimeType: picked.mimeType, sizeBytes: picked.sizeBytes
        };
        try {
          const serverMeta = await drive.callServer('getFileMetadata', picked.id);
          if (serverMeta && serverMeta.ok) meta = serverMeta;
        } catch (_) { /* fall back to picker-only metadata */ }
        pickedFiles[kind] = meta;
        updateUploadCard(kind, meta);
      } catch (e) {
        if (e && e.message === 'not_in_gas') {
          alert(
            'Google Drive Picker は Google Apps Script 上で動作します。\n\n' +
            '現在はローカル/プレビュー環境のため、Drive 連携は無効です。\n' +
            'Code.gs と appsscript.json と一緒に GAS にデプロイしてください。'
          );
        } else if (e && e.message === 'not_configured') {
          alert(
            'Google Drive Picker の API 設定が未完了です。\n\n' +
            'Code.gs 上部のコメントに従って:\n' +
            '  • Cloud Console で Google Picker API を有効化\n' +
            '  • API キー (HTTPリファラ制限) を作成\n' +
            '  • GCP プロジェクト番号を確認\n' +
            '  • setDriveConfig() で Script Properties に保存\n' +
            '  • Web アプリを再デプロイ'
          );
        } else if (e && e.message === 'picker_load_failed') {
          alert('Google Picker ライブラリの読み込みに失敗しました。ネットワーク接続を確認してください。');
        } else {
          alert('Picker 起動エラー: ' + (e && e.message ? e.message : e));
        }
      }
    }

    async function handleAnalyzeClick() {
      const btn = document.getElementById('analyzeBtn');
      if (!drive.inGas()) {
        alert('（プレビュー）GAS 上で実行すると、選択した Drive ファイルが Whisper + Claude 分析パイプラインに渡されます。');
        return;
      }
      if (!pickedFiles.slides || !pickedFiles.audio) {
        alert('提案資料と商談音声の両方を選択してください。');
        return;
      }
      const originalHtml = btn.innerHTML;
      btn.classList.add('is-loading');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span><span>分析中…</span>';
      try {
        const result = await drive.callServer('processSession', {
          slideFileId: pickedFiles.slides.id,
          audioFileId: pickedFiles.audio.id
        });
        if (result.ok) {
          alert('✓ ' + result.message + '\n\nスライド: ' + result.slide.name + '\n音声: ' + result.audio.name);
        } else {
          alert('分析エラー: ' + result.error);
        }
      } catch (e) {
        alert('サーバー呼び出しエラー: ' + (e && e.message ? e.message : e));
      } finally {
        btn.classList.remove('is-loading');
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    /* ============================================================
       Render
       ============================================================ */
    function renderHeader() {

      document.getElementById('meetingDate').textContent = MOCK_DATA.meta.meetingDate;
      document.getElementById('meetingCustomer').textContent = MOCK_DATA.meta.customerCompany;
      document.getElementById('analyzedAt').textContent = MOCK_DATA.meta.analyzedAt;
      document.getElementById('duration').textContent = MOCK_DATA.meta.duration;
      document.querySelector('#slideUpload .upload-filename').textContent = MOCK_DATA.meta.files.slides;
      document.querySelector('#audioUpload .upload-filename').textContent = MOCK_DATA.meta.files.audio;
    }

    function renderThumbnails() {
      const strip = document.getElementById('thumbnailStrip');
      strip.innerHTML = '';
      MOCK_DATA.slides.forEach((slide, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumbnail' + (idx === state.currentSlideIdx ? ' active' : '');
        thumb.innerHTML = `
          <div class="thumb-meta">
            <span class="thumb-num">${String(idx + 1).padStart(2, '0')}</span>
            <span class="thumb-dur">${escapeHtml(slide.duration || '')}</span>
          </div>
          <div class="thumb-title">${escapeHtml(slide.title)}</div>
        `;
        thumb.addEventListener('click', () => goToSlide(idx));
        strip.appendChild(thumb);
      });
    }

    function renderSlide() {
      const slide = MOCK_DATA.slides[state.currentSlideIdx];
      const total = MOCK_DATA.slides.length;
      document.getElementById('paneTitle').textContent = MOCK_DATA.meta.files.slides;
      document.getElementById('slideCounter').textContent = `${String(state.currentSlideIdx + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
      document.getElementById('prevBtn').disabled = state.currentSlideIdx === 0;
      document.getElementById('nextBtn').disabled = state.currentSlideIdx === total - 1;

      const view = document.getElementById('slideView');
      view.innerHTML = `
        <div class="slide-head">
          <div class="slide-head-eyebrow">${escapeHtml(slide.duration || '')}</div>
          <div class="slide-title">${escapeHtml(slide.title)}</div>
          <div class="slide-subtitle">${escapeHtml(slide.subtitle || '')}</div>
        </div>
        <div class="slide-body">${renderSlideBody(slide)}</div>
      `;
    }

    function renderSlideBody(slide) {
      const c = slide.content;
      switch (slide.template) {
        case 'agenda':
          return `<div class="agenda-list">${
            c.items.map((it, i) => `
              <div class="agenda-item">
                <div class="agenda-num">${String(i + 1).padStart(2, '0')}</div>
                <div>${escapeHtml(it)}</div>
              </div>
            `).join('')
          }</div>`;
        case 'issues':
          return `<div class="issue-grid">${
            c.items.map(it => `
              <div class="issue-card">
                <div class="issue-icon">${svgIcon(it.icon, 16)}</div>
                <div class="issue-name">${escapeHtml(it.name)}</div>
                <div class="issue-desc">${escapeHtml(it.desc)}</div>
              </div>
            `).join('')
          }</div>`;
        case 'features':
          return `<div class="feature-grid">${
            c.items.map(it => `
              <div class="feature-card">
                <div class="feature-icon">${svgIcon(it.icon, 22)}</div>
                <div class="feature-name">${escapeHtml(it.name)}</div>
                <div class="feature-desc">${escapeHtml(it.desc)}</div>
              </div>
            `).join('')
          }</div>`;
        case 'case':
          return `
            <div class="case-content">
              <div class="case-logo">${svgIcon(c.company, 36)}</div>
              <div class="case-stats">${
                c.stats.map(s => `
                  <div class="stat-card">
                    <div class="stat-value">${escapeHtml(s.value)}</div>
                    <div class="stat-label">${escapeHtml(s.label)}</div>
                  </div>
                `).join('')
              }</div>
            </div>
          `;
        case 'pricing':
          return `
            <div class="pricing-grid">
              <div class="price-main">
                <div class="price-eyebrow">Estimated</div>
                <div class="price-amount">${escapeHtml(c.amount)}</div>
                <div class="price-unit">${escapeHtml(c.unit)}</div>
              </div>
              <div class="price-side">${
                c.sideItems.map(it => `
                  <div class="price-row">
                    <div class="price-row-label">${escapeHtml(it.label)}</div>
                    <div class="price-row-value">${escapeHtml(it.value)}</div>
                  </div>
                `).join('')
              }</div>
            </div>
          `;
        default: return '';
      }
    }

    function renderTranscript() {
      const slide = MOCK_DATA.slides[state.currentSlideIdx];
      const list = document.getElementById('transcriptList');
      list.innerHTML = slide.transcript.map((u, i) => `
        <div class="utterance ${u.hasFeedback ? 'has-feedback' : ''}" data-idx="${i}">
          <div class="speaker-badge ${u.speaker}">
            ${u.speaker === 'sales' ? '営業' : '顧客'}
          </div>
          <div class="utterance-body">
            <div class="utterance-meta">
              <span class="speaker-name">${escapeHtml(u.name)}</span>
              <span class="utterance-time">${escapeHtml(u.time)}</span>
            </div>
            <div class="utterance-text">${escapeHtml(u.text)}</div>
          </div>
        </div>
      `).join('');
      document.getElementById('transcriptCount').textContent = slide.transcript.length;
    }

    function renderFeedback() {
      const slide = MOCK_DATA.slides[state.currentSlideIdx];
      const fb = slide.feedback;
      const improveList = fb.improve.map(i => {
        const t = typeof i === 'string' ? { text: i } : i;
        return `<li${t.urgent ? ' class="urgent"' : ''}>${escapeHtml(t.text)}</li>`;
      }).join('');

      document.getElementById('feedbackContent').innerHTML = `
        <div class="fb-section">
          <div class="fb-eyebrow good">${svgIcon('i-check', 12)}<span>Strengths</span></div>
          <div class="fb-block good">
            <ul class="fb-list">${fb.good.map(g => `<li>${escapeHtml(g)}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="fb-section">
          <div class="fb-eyebrow improve">${svgIcon('i-alert', 12)}<span>Opportunities</span></div>
          <div class="fb-block improve">
            <ul class="fb-list">${improveList}</ul>
          </div>
        </div>
        <div class="fb-section">
          <div class="fb-eyebrow suggest">${svgIcon('i-bulb', 12)}<span>Suggested Script</span></div>
          <div class="script-quote">${escapeHtml(fb.suggestedScript)}</div>
        </div>
      `;
    }

    function renderSummary() {
      const o = MOCK_DATA.overall;
      const scorePct = (o.score / 10) * 100;
      const dasharray = (scorePct / 100) * 175.93;
      const phaseSteps = o.phase.steps.map((step, i) => {
        let cls = '';
        if (i < o.phase.current) cls = 'done';
        else if (i === o.phase.current) cls = 'current';
        return `<div class="phase-step ${cls}">${escapeHtml(step)}</div>`;
      }).join('');

      const actionList = o.nextActions.map(a => `
        <div class="action-item">
          <div class="action-check"></div>
          <div class="action-content">
            <div class="action-title">${escapeHtml(a.title)}</div>
            <div class="action-meta">
              <span class="chip chip-${a.priority}">${a.priority === 'high' ? 'P1' : a.priority === 'mid' ? 'P2' : 'P3'}</span>
              <span class="action-due">${svgIcon('i-calendar', 11)} ${escapeHtml(a.due)}</span>
              <span class="action-note">· ${escapeHtml(a.note)}</span>
            </div>
          </div>
        </div>
      `).join('');

      const bantOrder = ['B', 'A', 'N', 'T'];
      const bantRows = bantOrder.map(k => {
        const v = o.bant[k];
        return `
          <div class="bant-row">
            <div class="bant-row-head">
              <div>
                <span class="bant-key">${k}</span>
                <span class="bant-key-sub">${escapeHtml(v.label).toUpperCase()}</span>
              </div>
              <span class="chip chip-${v.tone}">${escapeHtml(v.value)}</span>
            </div>
            <div class="bant-note">${escapeHtml(v.note)}</div>
          </div>
        `;
      }).join('');

      document.getElementById('summaryContent').innerHTML = `
        <div class="score-card">
          <div class="score-ring">
            <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
              <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(189,202,189,0.4)" stroke-width="5"/>
              <circle cx="32" cy="32" r="28" fill="none" stroke="#36A191" stroke-width="5"
                stroke-dasharray="${dasharray} 175.93"
                stroke-linecap="round"
                transform="rotate(-90 32 32)"/>
            </svg>
            <div class="score-value">${o.score}</div>
          </div>
          <div class="score-text">
            <strong>商談スコア: ${escapeHtml(o.scoreLabel)}</strong>
            <span>${escapeHtml(o.summary)}</span>
          </div>
        </div>

        <div class="summary-section">
          <div class="summary-header">
            <span class="eyebrow">Deal Phase</span>
          </div>
          <div class="phase-bar">${phaseSteps}</div>
        </div>

        <div class="summary-section">
          <div class="summary-header">
            <span class="eyebrow">Strengths</span>
          </div>
          <div class="fb-block good">
            <ul class="fb-list">${o.strengths.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
          </div>
        </div>

        <div class="summary-section">
          <div class="summary-header">
            <span class="eyebrow">Opportunities</span>
          </div>
          <div class="fb-block improve">
            <ul class="fb-list">${o.improvements.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
          </div>
        </div>

        <div class="summary-section">
          <div class="summary-header">
            <span class="eyebrow">Next Actions</span>
            <span class="chip chip-info">${o.nextActions.length}</span>
          </div>
          <div class="action-list">${actionList}</div>
        </div>

        <div class="summary-section">
          <div class="summary-header">
            <span class="eyebrow">BANT Status</span>
          </div>
          <div class="bant-grid">${bantRows}</div>
        </div>
      `;
    }

    /* ============================================================
       Interactions
       ============================================================ */
    function goToSlide(idx) {
      if (idx < 0 || idx >= MOCK_DATA.slides.length) return;
      state.currentSlideIdx = idx;
      renderThumbnails();
      renderSlide();
      renderTranscript();
      renderFeedback();
    }

    function switchTab(tab) {
      state.currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      document.querySelectorAll('.pane-section').forEach(s => {
        s.classList.toggle('active', s.id === `section-${tab}`);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader();
      renderThumbnails();
      renderSlide();
      renderTranscript();
      renderFeedback();
      renderSummary();

      document.getElementById('prevBtn').addEventListener('click', () => goToSlide(state.currentSlideIdx - 1));
      document.getElementById('nextBtn').addEventListener('click', () => goToSlide(state.currentSlideIdx + 1));
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.addEventListener('click', () => switchTab(b.dataset.tab));
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') goToSlide(state.currentSlideIdx - 1);
        if (e.key === 'ArrowRight') goToSlide(state.currentSlideIdx + 1);
      });

      document.getElementById('analyzeBtn').addEventListener('click', handleAnalyzeClick);
      document.getElementById('slideUpload').addEventListener('click', () => handleUploadClick('slides'));
      document.getElementById('audioUpload').addEventListener('click', () => handleUploadClick('audio'));

      // Warm up the server config so the first Picker click feels instant
      drive.loadConfig();
    });
  </script>
</body>
</html>
