<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalesCoach | 商談分析ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ===== Surface — Tonal Layering ===== */
      --surface-lowest:  #ffffff;
      --surface-low:     #f6f3f4;
      --surface:         #fcf8f9;
      --surface-high:    #eae7e8;
      --surface-highest: #dedddd;
      --surface-bright:  #d2d0d1;

      /* ===== Brand — Teal Spectrum ===== */
      --primary:              #36A191;
      --on-primary:           #ffffff;
      --primary-dark:         #297A6E;
      --primary-light:        rgba(54,161,145,0.08);
      --primary-fixed:        #5BC8B8;
      --primary-fixed-dim:    #94DBD1;
      --primary-container:    #297A6E;
      --on-primary-container: #CDEEE9;
      --secondary:            #36A191;
      --secondary-container:  #CDEEE9;
      --on-secondary-container:#297A6E;
      --tertiary:             #b04c00;

      /* ===== Typography Color ===== */
      --on-surface:           #1b1b1c;
      --on-surface-variant:   #5a6660;
      --text-muted:           #8a968a;

      /* ===== Ghost Border ===== */
      --outline:         #6e7a6f;
      --outline-variant: #bdcabd;
      --ghost-border:    rgba(189,202,189,0.20);

      /* ===== Status ===== */
      --danger:        #ba1a1a;
      --danger-weak:   rgba(186, 26, 26, 0.14);
      --warning-bg:    rgba(188,114,0,0.08);
      --warning-border:#b07000;
      --warning-accent:#c88000;
      --warning-text:  #5e3e00;
      --success:       #36A191;
      --success-weak:  rgba(54,161,145,0.14);
      --done-bg:       rgba(54,161,145,0.09);
      --done-text:     #297A6E;
      --delay-bg:      rgba(168,54,0,0.09);
      --delay-text:    #7e3000;

      /* ===== Pipeline ===== */
      --c-創注: #78CBCA;
      --c-D:    #5ABFC0;
      --c-C:    #46A9B8;
      --c-B:    #3890AE;
      --c-A:    #2878A4;
      --c-失注: #c5c4c5;

      /* ===== Radius ===== */
      --r-sm: 4px;
      --r:    6px;
      --r-lg: 8px;
      --r-xl: 12px;

      /* ===== Typography Scale ===== */
      --text-xs:   0.6875rem;
      --text-sm:   0.75rem;
      --text-base: 0.875rem;
      --text-md:   1.0rem;

      /* ===== Spacing ===== */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 24px;

      /* ===== Transitions ===== */
      --dur-fast: 0.1s;
      --dur-base: 0.18s;
      --dur-slow: 0.28s;

      /* ===== Elevation — Atmospheric Shadow ===== */
      --shadow-sm:    0px 4px 12px  rgba(0,39,117,0.04);
      --shadow-md:    0px 12px 24px rgba(0,39,117,0.05);
      --shadow-lg:    0px 20px 40px rgba(0,39,117,0.06);
      --shadow-float: 0px 24px 48px rgba(0,39,117,0.06);

      /* ===== Mono Font ===== */
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* ===== Slide viewport ===== */
      --slide-stage: #1b1b1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: var(--surface);
      color: var(--on-surface);
      font-size: var(--text-base);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      overflow: hidden;
    }
    h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .tabular { font-variant-numeric: tabular-nums; }
    .mono    { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Eyebrow — uppercase mono label sitting above titles */
    .eyebrow {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ============ HEADER ============ */
    .app-header {
      background: var(--surface-lowest);
      border-bottom: 1px solid var(--ghost-border);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky; top: 0; z-index: 100;
    }
    .brand-cluster { display: flex; align-items: center; gap: 16px; }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 24px; height: 24px;
      border-radius: var(--r);
      background: var(--primary);
      color: var(--on-primary);
      display: grid; place-items: center;
      font: 700 11px var(--font-mono);
    }
    .breadcrumb {
      color: var(--text-muted);
      font-size: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .breadcrumb-sep { color: var(--text-muted); opacity: 0.5; }
    .breadcrumb-current { color: var(--on-surface); font-weight: 500; }

    .header-right {
      display: flex; align-items: center; gap: 16px;
      font-size: 12px;
      color: var(--on-surface-variant);
    }
    .header-meta { display: flex; align-items: center; gap: 12px; }
    .header-meta-item { display: flex; align-items: center; gap: 6px; }
    .header-meta-label { color: var(--text-muted); font-size: 11px; }
    .header-meta-value { color: var(--on-surface); font-weight: 500; }

    .topbar-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg, var(--c-B), var(--c-A));
      color: #fff;
      font: 700 10px 'Inter', sans-serif;
      display: grid; place-items: center;
      letter-spacing: -0.02em;
      cursor: pointer;
    }

    /* ============ LAYOUT ============ */
    .app-main {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
      background: var(--surface);
    }

    /* ============ UPLOAD BAR ============ */
    .upload-bar {
      background: var(--surface-lowest);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .upload-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface-low);
      border-radius: var(--r);
      font-size: 12px;
      transition: background var(--dur-base);
      min-width: 220px;
      cursor: pointer;
    }
    .upload-card:hover { background: var(--surface-high); }
    .upload-icon {
      width: 32px; height: 32px;
      background: var(--surface-lowest);
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .upload-info {
      display: flex; flex-direction: column;
      flex: 1;
      min-width: 0;
      gap: 1px;
    }
    .upload-label {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .upload-filename {
      font-size: 12px;
      font-weight: 500;
      color: var(--on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .upload-card.swapped { background: var(--primary-light); }
    .upload-card.swapped .upload-icon { color: var(--primary-dark); }
    .upload-status {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      margin-left: 4px;
      border-radius: var(--r-sm);
      font: 700 9.5px/1.4 var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--warning-bg);
      color: var(--warning-text);
      vertical-align: 1px;
    }
    .upload-status.loading {
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .upload-status.loading::before {
      content: '';
      display: inline-block;
      width: 7px; height: 7px;
      border: 1.2px solid var(--primary-fixed-dim);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 4px;
      vertical-align: -1px;
    }
    .upload-card.is-loading { pointer-events: none; }

    /* Button — Primary */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px;
      border-radius: var(--r);
      font: 600 13px/1.4 'Inter', 'Noto Sans JP', sans-serif;
      letter-spacing: 0.01em;
      transition: background var(--dur-base);
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn.is-loading { pointer-events: none; opacity: 0.75; }
    .btn.is-loading .btn-spinner {
      width: 12px; height: 12px;
      border: 1.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-outline {
      background: var(--surface-lowest);
      color: var(--on-surface-variant);
      border: 1px solid var(--outline-variant);
    }
    .btn-outline:hover { background: var(--surface-high); border-color: var(--outline); }
    .btn-sm { padding: 5px 12px; font-size: 11px; }

    .meta-info {
      margin-left: auto;
      display: flex; align-items: center;
      gap: 20px;
    }
    .meta-info-block { display: flex; flex-direction: column; gap: 1px; }

    /* ============ ACTIONS HERO (Action-first principle) ============ */
    .actions-hero {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      margin: 0 20px 12px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .actions-hero-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px 6px;
    }
    .actions-hero-head .eyebrow { color: var(--primary-dark); }
    .actions-hero-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }
    .actions-hero-progress {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .actions-hero-count {
      font: 600 11px var(--font-mono);
      color: var(--on-surface-variant);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    .actions-hero-count strong { color: var(--primary-dark); }
    .actions-hero-bar {
      width: 80px; height: 4px;
      background: var(--surface-low);
      border-radius: 2px;
      overflow: hidden;
    }
    .actions-hero-bar-fill {
      height: 100%;
      background: var(--primary);
      transition: width var(--dur-slow) ease;
    }
    .actions-hero-list {
      padding: 4px 8px 12px;
    }
    .hero-action {
      border-radius: var(--r);
      transition: background var(--dur-fast);
    }
    .hero-action-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      cursor: pointer;
    }
    .hero-action-row:hover { background: var(--surface-low); border-radius: var(--r); }
    .hero-action.done .hero-action-row { opacity: 0.5; }
    .hero-action.done .hero-action-title { text-decoration: line-through; }
    .hero-action-check {
      width: 18px; height: 18px;
      border: 1.5px solid var(--outline-variant);
      border-radius: var(--r-sm);
      flex-shrink: 0;
      display: grid; place-items: center;
      color: transparent;
      transition: all var(--dur-fast);
      cursor: pointer;
    }
    .hero-action-check:hover { border-color: var(--primary); }
    .hero-action.done .hero-action-check {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
    }
    .hero-action-priority {
      flex-shrink: 0;
      padding: 1px 5px;
      border-radius: var(--r-sm);
      font: 700 10px var(--font-mono);
      letter-spacing: 0.04em;
    }
    .hero-action-priority.high { background: var(--danger-weak); color: var(--danger); }
    .hero-action-priority.mid  { background: var(--warning-bg); color: var(--warning-text); }
    .hero-action-priority.low  { background: var(--done-bg); color: var(--done-text); }
    .hero-action-title {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--on-surface);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-action-due {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font: 500 11px var(--font-mono);
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .hero-action-toggle {
      width: 18px; height: 18px;
      color: var(--text-muted);
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: transform var(--dur-base);
    }
    .hero-action.expanded .hero-action-toggle { transform: rotate(180deg); }
    .hero-action-detail {
      display: none;
      padding: 4px 12px 12px 46px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--on-surface-variant);
    }
    .hero-action.expanded .hero-action-detail { display: block; }
    .hero-action-detail-note {
      margin-bottom: 6px;
      color: var(--on-surface);
    }
    .hero-action-source {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: var(--r-sm);
      font: 600 10px var(--font-mono);
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background var(--dur-fast);
      margin-top: 6px;
    }
    .hero-action-source:hover { background: var(--primary-fixed-dim); }

    /* ============ SCENARIO UPDATE HERO (replaces Next Actions) ============
       Shows the diff this Session made to the Scenario:
       progressed / regressed / emerged / next deck edits.
       =================================================================== */
    .scen-hero {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      margin: 0 20px 12px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .scen-hero-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 12px 16px 8px;
    }
    .scen-hero-head .eyebrow { color: var(--primary-dark); }
    .scen-hero-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }
    .scen-hero-scoreshift {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: var(--surface-low);
      border-radius: 12px;
      font: 600 11px var(--font-mono);
    }
    .scen-hero-scoreshift-label {
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 9px;
    }
    .scen-hero-scoreshift-val {
      color: var(--on-surface);
      font-variant-numeric: tabular-nums;
    }
    .scen-hero-scoreshift-delta {
      color: var(--primary-dark);
      font-weight: 700;
    }
    .scen-hero-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 4px 12px 14px;
    }
    .scen-hero-col {
      padding: 10px 12px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .scen-hero-col-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 700 10px var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .scen-hero-col-head-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .scen-hero-col.progressed .scen-hero-col-head-dot { background: var(--primary); }
    .scen-hero-col.regressed .scen-hero-col-head-dot { background: var(--danger); }
    .scen-hero-col.emerged   .scen-hero-col-head-dot { background: #C18A2A; }
    .scen-hero-col.proposals .scen-hero-col-head-dot { background: var(--on-surface); }
    .scen-hero-col-head-label { color: var(--on-surface); }
    .scen-hero-col-head-count {
      margin-left: auto;
      padding: 1px 6px;
      background: var(--surface-lowest);
      border-radius: 8px;
      color: var(--on-surface-variant);
      font-size: 10px;
    }
    .scen-hero-item {
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--on-surface-variant);
      padding: 4px 0;
      cursor: pointer;
      transition: color var(--dur-fast);
      display: flex;
      gap: 6px;
    }
    .scen-hero-item:hover { color: var(--on-surface); }
    .scen-hero-item-marker {
      flex-shrink: 0;
      width: 14px;
      text-align: center;
      font: 700 10px var(--font-mono);
      color: var(--text-muted);
    }
    .scen-hero-item-text {
      min-width: 0;
      word-wrap: break-word;
    }
    .scen-hero-item-text strong {
      color: var(--on-surface);
      font-weight: 600;
    }
    .scen-hero-empty {
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 0;
      font-style: italic;
    }

    /* ============ SCENARIO DASHBOARD (シナリオ tab) ============ */
    .scen-dash {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .scen-dash-header {
      padding: 16px 18px;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--surface-lowest) 100%);
      border-radius: var(--r-xl);
    }
    .scen-dash-header-top {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .scen-dash-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }
    .scen-dash-version {
      font: 600 10px var(--font-mono);
      color: var(--primary-dark);
      background: var(--surface-lowest);
      padding: 2px 8px;
      border-radius: 8px;
      letter-spacing: 0.05em;
    }
    .scen-dash-account {
      font-size: 11.5px;
      color: var(--on-surface-variant);
      margin-bottom: 12px;
    }
    .scen-dash-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .scen-dash-metric {
      background: var(--surface-lowest);
      padding: 10px 12px;
      border-radius: var(--r-lg);
    }
    .scen-dash-metric-label {
      font: 600 9px var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .scen-dash-metric-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--on-surface);
      font-variant-numeric: tabular-nums;
    }
    .scen-dash-metric-delta {
      font: 600 11px var(--font-mono);
      color: var(--primary-dark);
      margin-left: 4px;
    }
    .scen-dash-metric-sub {
      font-size: 10.5px;
      color: var(--on-surface-variant);
      margin-top: 2px;
    }

    .scen-dash-section {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      padding: 14px 16px;
    }
    .scen-dash-section-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
    }
    .scen-dash-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--on-surface);
    }
    .scen-dash-section-sub {
      font-size: 11px;
      color: var(--text-muted);
    }
    .scen-dash-section-count {
      margin-left: auto;
      font: 600 10px var(--font-mono);
      color: var(--text-muted);
      padding: 2px 7px;
      background: var(--surface-low);
      border-radius: 8px;
    }

    /* === Matrix: Stakeholder × Issue agreement === */
    .scen-matrix {
      overflow-x: auto;
      border-radius: var(--r);
    }
    .scen-matrix-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 11px;
      min-width: 540px;
    }
    .scen-matrix-table th,
    .scen-matrix-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--outline-faint);
      text-align: center;
      vertical-align: middle;
    }
    .scen-matrix-table thead th {
      background: var(--surface-low);
      font: 600 10px var(--font-mono);
      color: var(--on-surface-variant);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .scen-matrix-table th.scen-matrix-issue-col {
      text-align: left;
      width: 38%;
      text-transform: none;
      letter-spacing: 0;
      font: 600 10.5px 'Inter', 'Noto Sans JP', sans-serif;
    }
    .scen-matrix-issue-cell {
      text-align: left !important;
      padding-left: 6px !important;
    }
    .scen-matrix-issue-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface);
      line-height: 1.4;
    }
    .scen-matrix-issue-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .scen-matrix-type-chip {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 6px;
      font: 700 9px var(--font-mono);
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }
    .scen-matrix-type-chip.t-as     { background: #FFE9E9; color: #A02020; }
    .scen-matrix-type-chip.t-to     { background: #DDF4EB; color: #1F7B5E; }
    .scen-matrix-type-chip.t-sol    { background: #E1ECFF; color: #1F4FA0; }
    .scen-matrix-type-chip.t-roi    { background: #FFF3D7; color: #8A6014; }
    .scen-matrix-type-chip.t-sch    { background: #EDE1FB; color: #5F2EA0; }
    .scen-matrix-type-chip.t-risk   { background: #FFE2D5; color: #A04A14; }
    .scen-matrix-type-chip.t-comp   { background: #FFD9D9; color: #993333; }
    .scen-matrix-type-chip.t-other  { background: var(--surface-low); color: var(--on-surface-variant); }
    .scen-matrix-stake-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .scen-matrix-stake-name {
      font: 600 11px 'Inter', 'Noto Sans JP', sans-serif;
      color: var(--on-surface);
      text-transform: none;
      letter-spacing: 0;
    }
    .scen-matrix-stake-role {
      font: 500 9px var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .scen-matrix-stake-head.eb .scen-matrix-stake-role { color: #8A6014; }
    .scen-matrix-stake-head.champion .scen-matrix-stake-role { color: var(--primary-dark); }
    .scen-matrix-stake-head.blocker .scen-matrix-stake-role { color: var(--danger); }
    .scen-cell {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
    }
    .scen-cell.agreed   { background: var(--done-bg);   color: var(--done-text); }
    .scen-cell.partial  { background: var(--warning-bg);color: var(--warning-text); }
    .scen-cell.negative { background: var(--danger-weak);color: var(--danger); }
    .scen-cell.unknown  { background: var(--surface-low);color: var(--text-muted); }
    .scen-cell.interested { background: var(--primary-light); color: var(--primary-dark); }
    .scen-cell.concern  { background: #FFD8C0; color: #A04A14; }
    .scen-matrix-row.has-blocker { background: rgba(192,75,60,0.04); }

    /* === Emerged issues === */
    .scen-emerged-list { display: flex; flex-direction: column; gap: 8px; }
    .scen-emerged-item {
      padding: 10px 12px;
      background: #FFF8E8;
      border-radius: var(--r-lg);
      border-left: 3px solid #C18A2A;
    }
    .scen-emerged-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .scen-emerged-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--on-surface);
    }
    .scen-emerged-type {
      font: 700 9px var(--font-mono);
      padding: 1px 6px;
      border-radius: 6px;
      letter-spacing: 0.05em;
      background: #F2E0BB;
      color: #6A4A0B;
    }
    .scen-emerged-sev {
      margin-left: auto;
      font: 700 9px var(--font-mono);
      letter-spacing: 0.05em;
    }
    .scen-emerged-sev.high { color: var(--danger); }
    .scen-emerged-sev.mid  { color: var(--warning-text); }
    .scen-emerged-evidence {
      font-size: 11px;
      color: var(--on-surface-variant);
      line-height: 1.55;
      margin-bottom: 4px;
    }
    .scen-emerged-action {
      font-size: 11px;
      color: var(--primary-dark);
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }
    .scen-emerged-action-arrow {
      flex-shrink: 0;
      font-weight: 700;
    }

    /* === Update proposals === */
    .scen-prop-list { display: flex; flex-direction: column; gap: 6px; }
    .scen-prop-item {
      display: grid;
      grid-template-columns: auto auto 1fr;
      gap: 10px;
      align-items: baseline;
      padding: 9px 12px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
    }
    .scen-prop-prio {
      flex-shrink: 0;
      padding: 1px 6px;
      border-radius: 6px;
      font: 700 9px var(--font-mono);
      letter-spacing: 0.05em;
    }
    .scen-prop-prio.high { background: var(--danger-weak); color: var(--danger); }
    .scen-prop-prio.mid  { background: var(--warning-bg); color: var(--warning-text); }
    .scen-prop-type {
      flex-shrink: 0;
      font: 600 9.5px var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .scen-prop-body { min-width: 0; }
    .scen-prop-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--on-surface);
      line-height: 1.45;
    }
    .scen-prop-reason {
      font-size: 11px;
      color: var(--on-surface-variant);
      margin-top: 3px;
      line-height: 1.5;
    }
    .scen-prop-target {
      font: 600 9px var(--font-mono);
      color: var(--primary-dark);
      margin-left: 6px;
      letter-spacing: 0.05em;
    }

    /* === Stakeholders mini summary === */
    .scen-stake-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .scen-stake-card {
      flex: 1;
      min-width: 140px;
      padding: 9px 11px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .scen-stake-card.unmet { border: 1px dashed #C04B3C; background: rgba(192,75,60,0.04); }
    .scen-stake-card-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface);
    }
    .scen-stake-card-role {
      font: 600 9.5px var(--font-mono);
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .scen-stake-card-role.eb { color: #8A6014; }
    .scen-stake-card-role.champion { color: var(--primary-dark); }
    .scen-stake-card-meta {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .scen-stake-card-meta.unmet { color: var(--danger); font-weight: 600; }

    /* ============ THUMBNAIL STRIP ============ */
    .thumbnail-strip {
      background: var(--surface);
      padding: 8px 20px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .thumbnail {
      flex-shrink: 0;
      width: 168px;
      min-height: 72px;
      background: var(--surface-lowest);
      border-radius: var(--r-lg);
      cursor: pointer;
      transition: background var(--dur-base);
      overflow: hidden;
      position: relative;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .thumbnail:hover { background: var(--surface-high); }
    .thumbnail.active {
      background: var(--surface-lowest);
      box-shadow: inset 0 0 0 2px var(--primary);
    }
    .thumb-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .thumb-num {
      width: 22px; height: 22px;
      background: var(--surface-low);
      color: var(--on-surface-variant);
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      font: 700 11px/1 var(--font-mono);
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .thumbnail.active .thumb-num {
      background: var(--primary);
      color: var(--on-primary);
    }
    .thumb-dur {
      font: 500 10px/1 var(--font-mono);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .thumb-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--on-surface);
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .thumb-confidence {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--surface-low);
    }
    .thumb-confidence-fill {
      height: 100%;
      transition: width var(--dur-slow);
    }
    .conf-high .thumb-confidence-fill { background: var(--primary); }
    .conf-mid  .thumb-confidence-fill { background: var(--warning-accent); }
    .conf-low  .thumb-confidence-fill { background: var(--danger); }

    /* Confidence chip — used in slide pane header */
    .conf-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: var(--r-sm);
      font: 600 11px var(--font-mono);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .conf-chip-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .conf-chip.high { background: var(--done-bg); color: var(--done-text); }
    .conf-chip.high .conf-chip-dot { background: var(--primary); }
    .conf-chip.mid  { background: var(--warning-bg); color: var(--warning-text); }
    .conf-chip.mid  .conf-chip-dot { background: var(--warning-accent); }
    .conf-chip.low  { background: var(--danger-weak); color: var(--danger); }
    .conf-chip.low  .conf-chip-dot { background: var(--danger); }

    /* Low-confidence warning banner — shown above transcript */
    .conf-warning {
      margin-bottom: 12px;
      padding: 10px 12px;
      background: var(--warning-bg);
      border-radius: var(--r-lg);
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 12px;
      color: var(--warning-text);
      line-height: 1.6;
    }
    .conf-warning.severe { background: var(--danger-weak); color: var(--danger); }
    .conf-warning-icon {
      flex-shrink: 0;
      margin-top: 1px;
    }
    .conf-warning strong { font-weight: 600; }
    .conf-warning-actions {
      margin-top: 6px;
      display: flex;
      gap: 6px;
    }
    .conf-action-pill {
      padding: 2px 8px;
      background: rgba(255,255,255,0.6);
      border-radius: var(--r-sm);
      font: 600 10px var(--font-mono);
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background var(--dur-fast);
      color: inherit;
    }
    .conf-action-pill:hover { background: rgba(255,255,255,0.9); }

    /* Title row in slide-pane-hd to accommodate the conf chip */
    .slide-pane-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ============ WORKSPACE ============ */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 12px;
      padding: 0 20px 20px;
      overflow: hidden;
      min-height: 0;
    }
    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 1fr; }
    }

    /* ----- Slide pane (the panel that hosts the slide viewer) ----- */
    .slide-pane {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .slide-pane-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px;
      gap: 12px;
      min-height: 56px;
    }
    .slide-pane-hd-left { display: flex; flex-direction: column; gap: 2px; }
    .slide-pane-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }
    .slide-stage {
      flex: 1;
      background: var(--slide-stage);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 0;
      overflow: hidden;
    }
    .slide {
      width: 100%;
      max-width: 760px;
      aspect-ratio: 16 / 9;
      background: var(--surface-lowest);
      border-radius: var(--r-lg);
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideIn var(--dur-slow) ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-head { margin-bottom: 22px; }
    .slide-head-eyebrow {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .slide-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--on-surface);
      letter-spacing: -0.015em;
      line-height: 1.25;
    }
    .slide-subtitle {
      font-size: 12px;
      color: var(--on-surface-variant);
      margin-top: 4px;
    }
    .slide-body { flex: 1; overflow: hidden; }

    /* Slide content variants — all use Tonal Layering, no shadows */
    .agenda-list { display: flex; flex-direction: column; gap: 8px; }
    .agenda-item {
      display: flex; align-items: center; gap: 14px;
      padding: 11px 14px;
      background: var(--surface-low);
      border-radius: var(--r);
      font-size: 14px;
    }
    .agenda-num {
      width: 24px; height: 24px;
      background: var(--primary);
      color: var(--on-primary);
      border-radius: 50%;
      display: grid; place-items: center;
      font: 700 11px var(--font-mono);
      flex-shrink: 0;
    }

    .issue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .issue-card {
      padding: 12px 14px;
      background: var(--surface-low);
      border-radius: var(--r);
      position: relative;
      padding-left: 16px;
    }
    .issue-card::before {
      content: '';
      position: absolute;
      left: 0; top: 14px; bottom: 14px;
      width: 3px;
      background: var(--warning-border);
      border-radius: 2px;
    }
    .issue-icon { color: var(--warning-border); margin-bottom: 6px; }
    .issue-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .issue-desc { font-size: 11px; color: var(--on-surface-variant); }

    .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .feature-card {
      padding: 14px;
      background: var(--primary-light);
      border-radius: var(--r-lg);
      text-align: center;
    }
    .feature-icon {
      color: var(--primary-dark);
      margin: 0 auto 8px;
      display: grid; place-items: center;
    }
    .feature-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--on-surface); }
    .feature-desc { font-size: 10.5px; color: var(--on-surface-variant); line-height: 1.5; }

    .case-content { display: flex; gap: 20px; align-items: center; }
    .case-logo {
      width: 84px; height: 84px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      display: grid; place-items: center;
      color: var(--on-surface-variant);
      flex-shrink: 0;
    }
    .case-stats { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; }
    .stat-card {
      padding: 16px 12px;
      background: var(--done-bg);
      border-radius: var(--r-lg);
      flex: 1;
      min-width: 110px;
      text-align: center;
    }
    .stat-value {
      font: 700 26px/1 'Inter', sans-serif;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .stat-label { font-size: 11px; color: var(--on-surface-variant); margin-top: 6px; }

    .pricing-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    .price-main {
      padding: 22px;
      background: var(--primary);
      color: var(--on-primary);
      border-radius: var(--r-lg);
    }
    .price-eyebrow {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--on-primary-container);
      margin-bottom: 8px;
    }
    .price-amount {
      font: 700 32px/1 'Inter', sans-serif;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .price-unit { font-size: 12px; opacity: 0.85; margin-top: 6px; }
    .price-side { display: flex; flex-direction: column; gap: 6px; }
    .price-row {
      padding: 10px 12px;
      background: var(--surface-low);
      border-radius: var(--r);
    }
    .price-row-label {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .price-row-value {
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* Slide nav */
    .slide-nav {
      padding: 10px 16px;
      background: var(--surface-lowest);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .nav-btn {
      width: 28px; height: 28px;
      border-radius: var(--r);
      background: var(--surface-low);
      color: var(--on-surface-variant);
      display: grid; place-items: center;
      transition: background var(--dur-base);
    }
    .nav-btn:hover { background: var(--surface-high); color: var(--on-surface); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .slide-counter {
      font: 600 12px var(--font-mono);
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      min-width: 64px;
      text-align: center;
    }

    /* ----- Content pane ----- */
    .content-pane {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .pane-tabs {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 44px;
      flex-shrink: 0;
      position: relative;
    }
    .pane-tabs::after {
      content: '';
      position: absolute;
      left: 16px; right: 16px; bottom: 0;
      height: 1px;
      background: var(--ghost-border);
    }
    .tab-btn {
      height: 44px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--on-surface-variant);
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color var(--dur-base);
    }
    .tab-btn:hover { color: var(--on-surface); }
    .tab-btn.active { color: var(--on-surface); font-weight: 600; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      left: 8px; right: 8px; bottom: -1px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
      z-index: 1;
    }
    .tab-badge {
      padding: 1px 6px;
      border-radius: var(--r-sm);
      background: var(--surface-low);
      color: var(--text-muted);
      font: 600 10px/1.4 var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .tab-btn.active .tab-badge {
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .tab-btn svg { color: currentColor; }

    .pane-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 24px;
      min-height: 0;
    }
    .pane-section { display: none; }
    .pane-section.active { display: block; }

    /* Transcript */
    .transcript-list { display: flex; flex-direction: column; gap: 4px; }
    .utterance {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--r);
      transition: background var(--dur-fast);
      cursor: pointer;
    }
    .utterance:hover { background: var(--primary-light); }
    .speaker-badge {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      font: 700 10px 'Inter', sans-serif;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .speaker-badge.sales { background: linear-gradient(135deg, var(--primary-fixed), var(--primary-dark)); }
    .speaker-badge.customer { background: linear-gradient(135deg, #9aa39d, #5a6660); }
    .utterance-body { flex: 1; min-width: 0; }
    .utterance-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .speaker-name { font-weight: 600; color: var(--on-surface); font-size: 12px; }
    .utterance-time {
      color: var(--text-muted);
      font: 500 10.5px var(--font-mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .utterance-text {
      font-size: 13px;
      color: var(--on-surface);
      line-height: 1.65;
    }
    .utterance.has-feedback .utterance-body {
      position: relative;
    }
    .utterance.has-feedback .utterance-body::after {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
      margin-left: 6px;
      vertical-align: middle;
      opacity: 0.6;
    }

    /* AI Feedback panels */
    .fb-section { margin-bottom: 16px; }
    .fb-section:last-child { margin-bottom: 0; }
    .fb-eyebrow {
      display: flex; align-items: center; gap: 8px;
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .fb-eyebrow.good { color: var(--done-text); }
    .fb-eyebrow.improve { color: var(--warning-border); }
    .fb-eyebrow.suggest { color: var(--primary-dark); }

    .fb-block {
      padding: 12px 14px;
      border-radius: var(--r-lg);
    }
    .fb-block.good { background: var(--done-bg); }
    .fb-block.improve { background: var(--warning-bg); }

    .fb-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .fb-list li {
      font-size: 12.5px;
      color: var(--on-surface);
      padding-left: 14px;
      position: relative;
      line-height: 1.6;
    }
    .fb-list li::before {
      content: '';
      position: absolute;
      left: 2px; top: 9px;
      width: 4px; height: 4px;
      background: currentColor;
      border-radius: 50%;
      opacity: 0.5;
    }
    .fb-list li.urgent {
      padding-left: 22px;
    }
    .fb-list li.urgent::before {
      content: '!';
      left: 2px; top: 0;
      width: 14px; height: 14px;
      background: var(--warning-accent);
      color: #fff;
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      font: 700 10px var(--font-mono);
      opacity: 1;
    }

    .script-quote {
      background: var(--surface-low);
      border-radius: var(--r-lg);
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--on-surface);
      position: relative;
      padding-left: 18px;
    }
    .script-quote::before {
      content: '';
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 3px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* Summary */
    .summary-section { margin-bottom: 24px; }
    .summary-section:last-child { margin-bottom: 0; }
    .summary-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }

    .score-card {
      display: flex; align-items: center; gap: 18px;
      padding: 16px;
      background: var(--primary-light);
      border-radius: var(--r-xl);
      margin-bottom: 20px;
    }
    .score-ring {
      width: 64px; height: 64px;
      position: relative;
      flex-shrink: 0;
    }
    .score-value {
      position: absolute;
      inset: 0;
      display: grid; place-items: center;
      font: 700 20px var(--font-mono);
      color: var(--primary-dark);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .score-text { flex: 1; }
    .score-text strong {
      display: block;
      font-size: 14px;
      color: var(--on-surface);
      margin-bottom: 4px;
    }
    .score-text span {
      font-size: 12px;
      color: var(--on-surface-variant);
      line-height: 1.55;
    }

    .phase-bar {
      display: flex;
      gap: 4px;
    }
    .phase-step {
      flex: 1;
      padding: 8px 6px;
      background: var(--surface-low);
      border-radius: var(--r);
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .phase-step.done {
      background: var(--done-bg);
      color: var(--done-text);
    }
    .phase-step.current {
      background: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
    }

    .action-list { display: flex; flex-direction: column; gap: 6px; }
    .action-item {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      transition: background var(--dur-base);
    }
    .action-item:hover { background: var(--surface-high); }
    .action-check {
      width: 16px; height: 16px;
      border: 1.5px solid var(--outline-variant);
      border-radius: var(--r-sm);
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
      transition: border-color var(--dur-base);
    }
    .action-check:hover { border-color: var(--primary); }
    .action-content { flex: 1; min-width: 0; }
    .action-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--on-surface);
      margin-bottom: 4px;
    }
    .action-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: var(--on-surface-variant);
    }
    .action-due {
      display: inline-flex; align-items: center; gap: 4px;
      font: 500 11px var(--font-mono);
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
    }
    .action-note { color: var(--text-muted); font-size: 11px; }

    .chip {
      display: inline-block;
      padding: 2px 6px;
      border-radius: var(--r-sm);
      font: 700 10px var(--font-mono);
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .chip-high { background: var(--danger-weak); color: var(--danger); }
    .chip-mid  { background: var(--warning-bg); color: var(--warning-text); }
    .chip-low  { background: var(--done-bg); color: var(--done-text); }
    .chip-info { background: var(--primary-light); color: var(--primary-dark); }

    .bant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bant-row {
      padding: 10px 12px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bant-row-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .bant-key {
      font: 700 11px var(--font-mono);
      color: var(--on-surface);
      letter-spacing: 0.04em;
    }
    .bant-key-sub {
      font: 500 10px var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .bant-note { font-size: 11.5px; color: var(--on-surface-variant); line-height: 1.55; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-highest); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--surface-bright); }

    /* ============ DEMO BADGE ============ */
    .demo-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      padding: 2px 6px;
      background: var(--warning-bg);
      color: var(--warning-text);
      font: 700 9px/1.4 var(--font-mono);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      border-radius: var(--r-sm);
    }

    /* ============ MODAL ============ */
    .modal {
      position: fixed; inset: 0; z-index: 1000;
      display: none;
      align-items: center; justify-content: center;
      padding: 24px;
      animation: fadeIn var(--dur-base) ease;
    }
    .modal.open { display: flex; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: -1;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-content {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-float);
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 14px 20px;
      background: var(--surface-high);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .modal-header-title { display: flex; flex-direction: column; gap: 2px; }
    .modal-title { font-size: 14px; font-weight: 600; color: var(--on-surface); }
    .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .modal-content.modal-wide { max-width: 580px; }
    .modal-footer {
      padding: 12px 20px;
      background: var(--surface-low);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ============ FORM SECTIONS (in modal) ============ */
    .form-section { margin-bottom: 20px; }
    .form-section:last-child { margin-bottom: 0; }
    .form-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-section-step {
      width: 22px; height: 22px;
      background: var(--surface-low);
      color: var(--on-surface-variant);
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      font: 700 11px var(--font-mono);
      flex-shrink: 0;
    }
    .form-section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--on-surface);
    }
    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--outline-variant);
      border-radius: var(--r);
      background: var(--surface-lowest);
      color: var(--on-surface);
      font: 13px 'Inter', 'Noto Sans JP', sans-serif;
      transition: border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(54, 161, 145, 0.15);
    }
    .form-control::placeholder { color: var(--text-muted); }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--on-surface-variant);
    }

    /* Deal preview card */
    .deal-preview {
      margin-top: 10px;
      padding: 12px 14px;
      background: var(--primary-light);
      border-radius: var(--r-lg);
    }
    .deal-preview-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--on-surface);
      margin-bottom: 6px;
    }
    .deal-preview-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
      font-size: 11px;
    }
    .deal-preview-meta-item { display: flex; flex-direction: column; gap: 1px; }
    .deal-preview-meta-label {
      font: 600 9px var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .deal-preview-meta-value {
      font-size: 12px;
      font-weight: 500;
      color: var(--on-surface);
    }
    .deal-preview-history {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--ghost-border);
      font-size: 11px;
      color: var(--on-surface-variant);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* File pickers inside the modal (compact form) */
    .file-picker-list { display: flex; flex-direction: column; gap: 6px; }
    .file-picker {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface-low);
      border-radius: var(--r);
      cursor: pointer;
      transition: background var(--dur-fast);
    }
    .file-picker:hover { background: var(--surface-high); }
    .file-picker.picked { background: var(--primary-light); }
    .file-picker-icon {
      width: 32px; height: 32px;
      background: var(--surface-lowest);
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .file-picker.picked .file-picker-icon { color: var(--primary-dark); }
    .file-picker-info { flex: 1; min-width: 0; }
    .file-picker-label {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .file-picker-name {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--on-surface);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-picker-name.empty { color: var(--text-muted); font-weight: 400; }
    .file-picker-action {
      font: 600 11px var(--font-mono);
      color: var(--primary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* New Session button in header */
    .btn-new-session {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: var(--primary);
      color: var(--on-primary);
      border-radius: var(--r);
      font: 600 12px 'Inter', 'Noto Sans JP', sans-serif;
      letter-spacing: 0.01em;
      transition: background var(--dur-base);
    }
    .btn-new-session:hover { background: var(--primary-dark); }
    .btn-new-session:active { transform: scale(0.97); }

    /* Session goal display in header */
    .header-goal {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: var(--r-sm);
      font-size: 11px;
      font-weight: 500;
      max-width: 320px;
    }
    .header-goal-label {
      font: 600 9px var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .header-goal-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .modal-close {
      width: 28px; height: 28px;
      border-radius: var(--r);
      display: grid; place-items: center;
      color: var(--on-surface-variant);
      transition: background var(--dur-fast);
    }
    .modal-close:hover { background: var(--surface-lowest); color: var(--on-surface); }

    /* Sample list */
    .sample-list { display: flex; flex-direction: column; gap: 6px; }
    .sample-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: var(--surface-low);
      border-radius: var(--r-lg);
      transition: background var(--dur-base);
      text-align: left;
      width: 100%;
    }
    .sample-item:hover { background: var(--primary-light); }
    .sample-icon {
      width: 36px; height: 36px;
      background: var(--surface-lowest);
      border-radius: var(--r);
      display: grid; place-items: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .sample-info { flex: 1; min-width: 0; }
    .sample-name {
      font-size: 13px; font-weight: 500;
      color: var(--on-surface);
    }
    .sample-meta {
      font: 500 11px var(--font-mono);
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }
    .sample-desc {
      font-size: 11px;
      color: var(--on-surface-variant);
      margin-top: 2px;
    }

    /* ============ PROGRESS OVERLAY ============ */
    .progress-overlay {
      position: fixed; inset: 0; z-index: 1100;
      display: none;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: fadeIn var(--dur-base) ease;
    }
    .progress-overlay.open { display: flex; }
    .progress-card {
      background: var(--surface-lowest);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-float);
      width: 100%;
      max-width: 440px;
      padding: 24px 26px;
    }
    .progress-title-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 4px;
    }
    .progress-title { font-size: 14px; font-weight: 600; color: var(--on-surface); }
    .progress-sub {
      font-size: 12px; color: var(--on-surface-variant);
      margin-bottom: 18px;
      line-height: 1.55;
    }
    .progress-bar {
      height: 6px;
      background: var(--surface-low);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.4s linear;
    }
    .progress-stages { display: flex; flex-direction: column; gap: 4px; }
    .progress-stage {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-radius: var(--r);
      font-size: 12.5px;
      color: var(--text-muted);
      transition: background var(--dur-base), color var(--dur-base);
    }
    .progress-stage.active {
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 500;
    }
    .progress-stage.done { color: var(--on-surface); }
    .stage-marker {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--outline-variant);
      flex-shrink: 0;
      display: grid; place-items: center;
      color: #fff;
    }
    .progress-stage.active .stage-marker {
      border-color: var(--primary);
      border-top-color: transparent;
      animation: spin 0.7s linear infinite;
    }
    .progress-stage.done .stage-marker {
      background: var(--primary);
      border-color: var(--primary);
    }
    .stage-time {
      margin-left: auto;
      font: 500 10.5px var(--font-mono);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .progress-stage.done .stage-time { color: var(--on-surface-variant); }

    /* ============ SLIDE TEMPLATES: pdf-page & text ============ */
    .pdf-page {
      width: 100%; height: 100%;
      display: grid; place-items: center;
    }
    .pdf-page img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      border-radius: var(--r);
      box-shadow: 0 0 0 1px var(--ghost-border);
    }
    .text-slide-body {
      display: flex; flex-direction: column; gap: 10px;
    }
    .text-slide-body p {
      font-size: 13.5px;
      color: var(--on-surface);
      line-height: 1.7;
      padding: 8px 12px;
      background: var(--surface-low);
      border-radius: var(--r);
    }
    .text-slide-body p:first-child {
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 600;
    }

    .speaker-badge.system {
      background: linear-gradient(135deg, #c5c4c5, #8a968a);
      font-size: 8.5px;
    }

    /* When showing a PDF image, the slide-head can be more compact */
    .slide.template-image { padding: 18px 22px; }
    .slide.template-image .slide-head { margin-bottom: 12px; }
    .slide.template-image .slide-title { font-size: 16px; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .slide { animation: none !important; }
    }
  </style>
</head>

    const pipelineSync = (() => {
      const log = [];
      const subscribers = [];
      function emit(event, payload) {
        const entry = { event, at: new Date().toISOString(), payload };
        log.push(entry);
        console.log('[pipelineSync] ' + event, payload);
        subscribers.forEach(fn => { try { fn(entry); } catch (_) {} });

      }
      return {
        sessionStarted(session)     { emit('session.started',  session); },
        sessionAnalyzed(session)    { emit('session.analyzed', session); },
        actionsGenerated(actions)   { emit('actions.generated', { count: actions.length, items: actions }); },
        actionUpdated(action)       { emit('action.updated',    action); },
        frameworkUpdated(scores)    { emit('framework.updated', scores); },
        suggestStageChange(dealId, fromStage, toStage, reason) {
          emit('stage.suggested', { dealId, fromStage, toStage, reason });
        },
        getLog() { return log.slice(); },
        subscribe(fn) { subscribers.push(fn); return () => {
          const i = subscribers.indexOf(fn);
          if (i >= 0) subscribers.splice(i, 1);
        }; }
      };
    })();

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function formatBytes(b) {
      const n = parseInt(b, 10);
      if (!n) return '';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
      if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
      return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';

    /* ============================================================
       Google Drive Picker bridge
       Server (Code.gs) provides API key / project number and
       OAuth token; this module loads the Picker JS lazily and
       exposes drive.pick(kind) → Promise<file|null>.
       ============================================================ */
    const CONFIG = { apiKey: '', appId: '' };
    const pickedFiles = { slides: null, audio: null };

    const drive = (() => {
      let pickerLoaded = false;
      let configLoaded = false;

      function inGas() {
        return typeof google !== 'undefined' &&
               typeof google.script !== 'undefined' &&
               typeof google.script.run !== 'undefined';
      }

      function callServer(name, ...args) {
        return new Promise((resolve, reject) => {
          if (!inGas()) { reject(new Error('not_in_gas')); return; }
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            [name](...args);
        });
      }

      async function loadConfig() {
        if (configLoaded) return CONFIG;
        if (!inGas()) { configLoaded = true; return CONFIG; }
        try {
          const cfg = await callServer('getDriveConfig');
          if (cfg && cfg.apiKey && cfg.appId) {
            CONFIG.apiKey = cfg.apiKey;
            CONFIG.appId  = cfg.appId;
          }
        } catch (e) { /* leave CONFIG empty — caller will surface a setup message */ }
        configLoaded = true;
        return CONFIG;
      }

      function loadPickerScript() {
        if (pickerLoaded) return Promise.resolve();
        return new Promise((resolve, reject) => {
          const onReady = () => gapi.load('picker', () => { pickerLoaded = true; resolve(); });
          if (typeof gapi !== 'undefined') return onReady();
          const s = document.createElement('script');
          s.src = 'https://apis.google.com/js/api.js';
          s.onload = onReady;
          s.onerror = () => reject(new Error('picker_load_failed'));
          document.head.appendChild(s);
        });
      }

      const MIME_FILTERS = {
        slides: [
          'application/vnd.google-apps.presentation',
          'application/vnd.openxmlformats-officedocument.presentationml.presentation',
          'application/pdf'
        ].join(','),
        audio: [
          'audio/mpeg', 'audio/mp4', 'audio/wav', 'audio/x-m4a',
          'audio/ogg', 'audio/webm', 'video/mp4', 'video/webm'
        ].join(',')
      };

      async function pick(kind) {
        if (!inGas()) throw new Error('not_in_gas');
        await loadConfig();
        if (!CONFIG.apiKey || !CONFIG.appId) throw new Error('not_configured');
        await loadPickerScript();
        const oauthToken = await callServer('getOAuthToken');

        const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setMimeTypes(MIME_FILTERS[kind])
          .setIncludeFolders(false)
          .setMode(google.picker.DocsViewMode.LIST);

        const title = kind === 'slides' ? '提案資料を選択' : '商談音声を選択';

        return new Promise((resolve) => {
          const picker = new google.picker.PickerBuilder()
            .setAppId(CONFIG.appId)
            .setOAuthToken(oauthToken)
            .setDeveloperKey(CONFIG.apiKey)
            .addView(view)
            .setTitle(title)
            .setCallback((data) => {
              if (data.action === google.picker.Action.PICKED) {
                resolve(data.docs[0]);
              } else if (data.action === google.picker.Action.CANCEL) {
                resolve(null);
              }
            })
            .build();
          picker.setVisible(true);
        });
      }

      return { inGas, loadConfig, pick, callServer };
    })();

    // Lazy-load PDF.js
    let _pdfjsReady = null;
    function ensurePdfJs() {
      if (_pdfjsReady) return _pdfjsReady;
      _pdfjsReady = new Promise((resolve, reject) => {
        if (typeof pdfjsLib !== 'undefined') return resolve();
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload = () => {
          pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          resolve();
        };
        s.onerror = () => reject(new Error('PDF.jsの読み込みに失敗しました'));
        document.head.appendChild(s);
      });
      return _pdfjsReady;
    }

    // Lazy-load JSZip (for PPTX text extraction)
    let _jsZipReady = null;
    function ensureJsZip() {
      if (_jsZipReady) return _jsZipReady;
      _jsZipReady = new Promise((resolve, reject) => {
        if (typeof JSZip !== 'undefined') return resolve();
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('JSZipの読み込みに失敗しました'));
        document.head.appendChild(s);
      });
      return _jsZipReady;
    }

    async function renderPdfToSlides(file) {
      await ensurePdfJs();
      const data = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data }).promise;
      const slides = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.8 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        slides.push({
          title: `ページ ${i}`,
          subtitle: file.name,
          template: 'image',
          content: { imageUrl: canvas.toDataURL('image/jpeg', 0.86) }
        });
      }
      return slides;
    }

    async function extractPptxSlides(file) {
      await ensureJsZip();
      const zip = await JSZip.loadAsync(file);
      const slidePaths = Object.keys(zip.files)
        .filter(p => /^ppt\/slides\/slide\d+\.xml$/.test(p))
        .sort((a, b) => {
          const na = parseInt(a.match(/slide(\d+)\.xml/)[1], 10);
          const nb = parseInt(b.match(/slide(\d+)\.xml/)[1], 10);
          return na - nb;
        });
      const slides = [];
      const parser = new DOMParser();
      for (let i = 0; i < slidePaths.length; i++) {
        const xml = await zip.file(slidePaths[i]).async('text');
        const doc = parser.parseFromString(xml, 'text/xml');
        // <a:t> nodes hold text runs in PPTX slide XML
        const tNodes = doc.getElementsByTagName('a:t');
        const texts = [];
        for (let j = 0; j < tNodes.length; j++) {
          const t = (tNodes[j].textContent || '').trim();
          if (t) texts.push(t);
        }
        slides.push({
          title: texts[0] || `スライド ${i + 1}`,
          subtitle: file.name,
          template: 'text',
          content: { paragraphs: texts.slice(1) }
        });
      }
      return slides;
    }

    function pickLocalFile(accept) {
      return new Promise((resolve) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = accept;
        input.style.display = 'none';
        input.addEventListener('change', () => {
          const file = input.files && input.files[0] ? input.files[0] : null;
          input.remove();
          resolve(file);
        });
        // Cancel detection: focus returns without selection
        document.body.appendChild(input);
        input.click();
      });
    }

      { key: 'stt',      label: '音声を文字起こし (Whisper)',         ms: 2600 },

    function runAnalysisProgress() {
      const overlay  = document.getElementById('progressOverlay');
      const fill     = document.getElementById('progressFill');
      const stagesEl = document.getElementById('progressStages');

      stagesEl.innerHTML = ANALYSIS_STAGES.map(s => `
        <div class="progress-stage" data-key="${s.key}">
          <div class="stage-marker"></div>
          <span class="stage-label">${escapeHtml(s.label)}</span>
          <span class="stage-time">—</span>
        </div>
      `).join('');

      overlay.classList.add('open');
      fill.style.width = '0%';

      const totalMs = ANALYSIS_STAGES.reduce((sum, s) => sum + s.ms, 0);
      let elapsed = 0;

      return (async () => {
        for (const stage of ANALYSIS_STAGES) {
          const el = stagesEl.querySelector(`[data-key="${stage.key}"]`);
          el.classList.add('active');
          const start = performance.now();
          await new Promise(resolve => {
            const tick = () => {
              const stageElapsed = performance.now() - start;
              const total = elapsed + Math.min(stageElapsed, stage.ms);
              fill.style.width = Math.min((total / totalMs) * 100, 100) + '%';
              if (stageElapsed >= stage.ms) resolve();
              else requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          });
          elapsed += stage.ms;
          el.classList.remove('active');
          el.classList.add('done');
          el.querySelector('.stage-marker').innerHTML = svgIcon('i-check', 10);
          el.querySelector('.stage-time').textContent = (stage.ms / 1000).toFixed(1) + 's';
        }
        fill.style.width = '100%';
        await new Promise(r => setTimeout(r, 700));
        overlay.classList.remove('open');
      })();
    }

    /* ──────────────────────────────────────────────────────────────
       Slide ingest pipeline — shared between Drive Picker and the
       local file fallback. Takes a Blob/File and routes it to the
       right parser based on mimeType / filename.
       ────────────────────────────────────────────────────────────── */
    async function applySlideBlob(source, displayName, mimeType) {
      const lowerName = (displayName || '').toLowerCase();
      const isGoogleSlides = mimeType === 'application/vnd.google-apps.presentation';
      const isPdf = isGoogleSlides
        || mimeType === 'application/pdf'
        || lowerName.endsWith('.pdf');
      const isPptx = (mimeType && mimeType.indexOf('presentationml') !== -1)
        || lowerName.endsWith('.pptx');

      let slides;
      if (isPdf) {
        slides = await renderPdfToSlides(source);
      } else if (isPptx) {
        slides = await extractPptxSlides(source);
      } else {
        throw new Error('対応形式は PDF / PPTX / Google Slides です。');
      }
      if (!slides.length) throw new Error('スライドが読み取れませんでした。');

      replaceSlides(slides);
      state.currentSlideIdx = 0;
      renderThumbnails();
      renderSlide();
      renderTranscript();
      renderFeedback();
      return slides.length;
    }

    /* Download a file picked via Drive Picker, using the user's
       OAuth token directly against the Drive REST API. Google Slides
       are exported to PDF on the fly. */
    async function fetchDriveFileBlob(fileId, oauthToken, mimeType) {
      const isGoogleSlides = mimeType === 'application/vnd.google-apps.presentation';
      const baseUrl = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fileId);
      const url = isGoogleSlides
        ? baseUrl + '/export?mimeType=' + encodeURIComponent('application/pdf')
        : baseUrl + '?alt=media';
      const resp = await fetch(url, { headers: { Authorization: 'Bearer ' + oauthToken } });
      if (!resp.ok) {
        const t = await resp.text().catch(() => '');
        throw new Error('Driveダウンロード失敗 (HTTP ' + resp.status + ') ' + t.substring(0, 200));
      }
      return await resp.blob();
    }

    /* Pure pickers — return the picked source without applying it.
       Used both by the top-bar upload cards (immediate apply) and the
       new-session modal (apply on "分析を開始"). */
    async function pickSlideFromAnywhere() {
      // 1) Drive Picker (production)
      if (drive.inGas()) {
        await drive.loadConfig();
        if (CONFIG.apiKey && CONFIG.appId) {
          try {
            const picked = await drive.pick('slides');
            if (picked) {
              let meta = {
                id: picked.id, name: picked.name,
                mimeType: picked.mimeType, sizeBytes: picked.sizeBytes
              };
              try {
                const serverMeta = await drive.callServer('getFileMetadata', picked.id);
                if (serverMeta && serverMeta.ok) meta = serverMeta;
              } catch (_) {}
              const token = await drive.callServer('getOAuthToken');
              const blob = await fetchDriveFileBlob(picked.id, token, picked.mimeType);
              return { meta, blob, mimeType: picked.mimeType };
            }
          } catch (e) {
            console.warn('Drive slide pick fell through:', e);
          }
        }
      }
      // 2) Local file (demo)
      const file = await pickLocalFile('.pdf,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation');
      if (!file) return null;
      return {
        meta: { id: 'local-' + Date.now(), name: file.name, sizeBytes: file.size, mimeType: file.type },
        blob: file, mimeType: file.type
      };
    }

    async function pickAudioFromAnywhere() {
      // 1) Drive Picker (production)
      if (drive.inGas()) {
        await drive.loadConfig();
        if (CONFIG.apiKey && CONFIG.appId) {
          try {
            const picked = await drive.pick('audio');
            if (picked) {
              let meta = {
                id: picked.id, name: picked.name,
                mimeType: picked.mimeType, sizeBytes: picked.sizeBytes
              };
              try {
                const serverMeta = await drive.callServer('getFileMetadata', picked.id);
                if (serverMeta && serverMeta.ok) meta = serverMeta;
              } catch (_) {}
              return { meta };
            }
          } catch (e) {
            console.warn('Drive audio pick fell through:', e);
          }
        }
      }
      // 2) Sample library (demo)
      const sample = await showAudioSampleModal();
      if (!sample) return null;
      return {
        meta: { id: sample.id, name: sample.name, sizeBytes: Math.round(sample.sizeMb * 1024 * 1024) }

    /* Apply helpers — render a picked source into the workspace. */
    async function applySlideToWorkspace(picked) {
      updateUploadCard('slides', picked.meta, { loading: true, loadingLabel: 'スライド解析中' });
      try {
        if (picked.blob) {
          await applySlideBlob(picked.blob, picked.meta.name, picked.mimeType);
        }
        updateUploadCard('slides', picked.meta);
      } catch (e) {
        updateUploadCard('slides', picked.meta);
        throw e;
      }
    }

    function applyAudioToWorkspace(picked) {
      updateUploadCard('audio', picked.meta);
